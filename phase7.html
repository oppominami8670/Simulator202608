<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>料金シミュレーター Phase 7</title><style>html,body{height:100%;margin:0;overflow:hidden}body{font-family:Meiryo,"Noto Sans JP",sans-serif;background:#f4f6f8;color:#20242a}*{box-sizing:border-box}.app{height:100vh;display:grid;grid-template-rows:58px 48px minmax(0,1fr) 68px}.header,.tabs,.bottom{background:#fff;border-bottom:1px solid #d9dee5}.header{display:flex;align-items:center;padding:0 24px;font-size:20px;font-weight:700}.header small{margin-left:12px;font-size:12px;color:#69717d;font-weight:400}.tabs{display:flex;align-items:end;padding-left:24px}.tab{height:48px;padding:0 28px;border:0;background:#fff;color:#69717d;font-weight:700;border-bottom:3px solid transparent;cursor:pointer}.tab.active{color:#087f5b;background:#eaf7f2;border-bottom-color:#087f5b}.main{min-height:0;padding:14px 20px 10px;overflow:hidden}.panel{height:100%;display:none}.panel.active{display:flex;flex-direction:column;min-height:0}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.head h2{margin:0;font-size:17px}.hint{font-size:12px;color:#69717d}.tools{display:flex;gap:8px}.btn{border:1px solid #d9dee5;background:#fff;border-radius:6px;padding:7px 12px;font-weight:700;cursor:pointer}.btn.primary{background:#087f5b;color:#fff;border-color:#087f5b}.wrap{flex:1;min-height:0;overflow:auto;background:#fff;border:1px solid #d9dee5;border-radius:8px}.table{width:100%;border-collapse:collapse}.table th,.table td{border:1px solid #d9dee5;padding:8px;text-align:center;vertical-align:middle}.table th{background:#f8fafb;font-size:12px}.cell{cursor:pointer}.cell:hover{background:#eaf7f2}.carrier{font-weight:700;color:#087f5b}.detail-line{font-size:11px;color:#4e5965;margin-top:2px}.yen{font-size:16px;font-weight:700;margin-top:3px}.mode{font-size:10px;color:#69717d}.delta{font-weight:700}.down{color:#087f5b}.up{color:#c43d3d}.bottom{border-top:1px solid #d9dee5;border-bottom:0;display:flex;align-items:center;padding:8px 20px;overflow:hidden}.bi{padding:0 18px;border-right:1px solid #d9dee5;white-space:nowrap}.bi:first-child{padding-left:0}.bl{font-size:11px;color:#69717d}.bv{font-size:18px;font-weight:700}.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:20}.modal-bg.open{display:flex}.modal{width:min(92vw,820px);max-height:90vh;overflow:auto;background:#fff;border-radius:10px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.25)}.modal h3{margin:0 0 15px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode-btn{padding:13px;border:1px solid #d9dee5;background:#fff;border-radius:7px;text-align:left;cursor:pointer}.mode-btn.selected{border:2px solid #087f5b;background:#eaf7f2}.field{margin:8px 0}.field label{display:block;font-size:12px;color:#69717d;margin-bottom:4px}.field input,.field select{width:100%;padding:8px;border:1px solid #d9dee5;border-radius:6px;font:inherit}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.detail{display:none;background:#f8fafb;border:1px solid #d9dee5;border-radius:7px;padding:12px}.detail.open{display:block}.summary{margin-top:10px;padding:12px;background:#eaf7f2;border-radius:7px;display:flex;justify-content:space-between;align-items:center}.summary strong{font-size:20px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.loading{position:fixed;inset:0;background:rgba(255,255,255,.94);z-index:100;display:flex;align-items:center;justify-content:center;font-weight:700}.error{color:#c43d3d;padding:12px}</style></head><body><div id="loading" class="loading">料金マスタを読み込んでいます…</div><div class="app"><header class="header">料金シミュレーター <small>Phase 7 / 既存料金マスタ接続版</small></header><nav class="tabs"><button class="tab active" data-tab="proposal">比較・提案</button><button class="tab" data-tab="monthly">月額料金</button></nav><main class="main"><section id="proposal" class="panel active"><div class="head"><div><h2>比較・提案</h2><div class="hint">家族ごとにキャリア・プラン・機種を組み合わせて提案します。</div></div><div class="tools"><button id="add" class="btn primary">＋ 提案を追加</button><button id="copy" class="btn">コピー</button></div></div><div class="wrap"><table class="table"><thead><tr><th>提案</th><th>父<br><span class="hint">現在 ¥8,500</span></th><th>母<br><span class="hint">現在 ¥6,500</span></th><th>長男<br><span class="hint">現在 ¥3,500</span></th><th>長女<br><span class="hint">現在 ¥1,000</span></th><th>家族総額 / 増減</th></tr></thead><tbody id="body"></tbody></table></div></section><section id="monthly" class="panel"><div class="head"><h2>月額料金</h2><span class="hint">回線毎・家族総額</span></div><div class="wrap"><table class="table"><thead><tr><th>家族</th><th>現在</th><th>提案①</th><th>提案②</th><th>提案③</th></tr></thead><tbody id="monthlyBody"></tbody></table></div></section></main><footer class="bottom"><div class="bi"><div class="bl">現在</div><div id="currentTotal" class="bv">¥19,500</div></div><div id="bottom"></div><div class="bi"><div class="bl">増減（月額）</div><div id="bd" class="bv"></div></div><div class="bi"><div class="bl">増減（年額）</div><div id="bdy" class="bv"></div></div></footer></div><div id="modalBg" class="modal-bg"><div class="modal"><h3 id="title"></h3><div class="field"><label>入力方式</label><div class="modes"><button class="mode-btn selected" data-mode="simple">簡易入力<br><small>月額合計を直接入力</small></button><button class="mode-btn" data-mode="detail">提案内容を設定<br><small>既存料金マスタからキャリア・プラン・機種を選択</small></button></div></div><div id="simpleBox"><div class="grid2"><div class="field"><label>キャリア / 提案先</label><select id="carrierSimple"></select></div><div class="field"><label>月額合計</label><input id="amount" type="number" min="0" step="100"></div></div></div><div id="detailBox" class="detail"><div class="grid2"><div class="field"><label>携帯キャリア</label><select id="dCarrier"></select></div><div class="field"><label>料金プラン</label><select id="dPlan"></select></div><div class="field"><label>データ量</label><select id="dData"></select></div><div class="field"><label>機種カテゴリ</label><select id="dCat"><option value="SIMのみ">SIMのみ</option><option value="iPhone">iPhone</option><option value="Android">Android</option></select></div><div class="field"><label>機種</label><select id="dDevice"></select></div><div class="field"><label>端末購入区分</label><select id="dCon"></select></div><div class="field"><label>端末支払回数</label><select id="dIns"></select></div><div class="field"><label>端末値引き総額</label><input id="dDevDisc" type="number" min="0" step="100" value="0"></div></div><div class="field"><label>割引（複数選択可）</label><div class="grid2" id="dDiscounts"></div></div><div class="field"><label>追加オプション</label><div class="grid2" id="dOptions"></div></div><div class="field"><label>固定回線</label><select id="dNet"></select></div><div class="field"><label>固定回線区分</label><select id="dNetType"></select></div><div class="field"><label>固定回線割引・セット割</label><div class="grid2" id="dNetOpts"></div></div><div class="summary"><span>既存料金マスタによる提案月額</span><strong id="detailTotal">¥0</strong></div><div id="calcNote" class="hint"></div></div><div class="actions"><button id="cancel" class="btn">キャンセル</button><button id="save" class="btn primary">保存</button></div></div></div><script>const GAS_URL="https://script.google.com/macros/s/AKfycbxUj8Ojmgq2H-weGZRui_rdi9W6_y6QSUjbjKY1Lr89IsErmVNqxYZx_walEIs3QoaA/exec";const members=[['父',8500],['母',6500],['長男',3500],['長女',1000]],money=n=>'¥'+Math.round(Number(n)||0).toLocaleString('ja-JP');let DATA=null,proposals=[{name:'提案①',note:'新しい提案',cells:members.map(()=>({carrier:'',amount:0,mode:'simple',detail:{}}))},{name:'提案②',note:'新しい提案',cells:members.map(()=>({carrier:'',amount:0,mode:'simple',detail:{}}))},{name:'提案③',note:'新しい提案',cells:members.map(()=>({carrier:'',amount:0,mode:'simple',detail:{}}))}],edit=[0,0];const total=p=>p.cells.reduce((s,c)=>s+Number(c.amount||0),0);function opts(sel,arr,placeholder){sel.innerHTML=placeholder?'<option value="">'+placeholder+'</option>':'';arr.forEach(v=>sel.appendChild(new Option(v,v)))}function carrierNames(){return Object.keys(DATA||{})}function plans(c){return DATA[c]?.plans||[]}function devices(c,cat){return (DATA[c]?.devices||[]).filter(r=>r[0]===cat)}function fillDetail(){const c=dCarrier.value;if(!c||!DATA[c])return;const ps=[...new Set(plans(c).map(r=>r[0]))];opts(dPlan,ps,'プラン選択');opts(dData,[],'データ量');opts(dDevice,[],'機種選択');opts(dCon,[],'区分');opts(dIns,[],'回数');opts(dNet,[...new Set((DATA[c].internets||[]).map(r=>r[0]).filter(Boolean))],'固定回線なし');dNetType.innerHTML='<option value="">区分</option>';dDiscounts.innerHTML='';(DATA[c].discounts||[]).forEach((r,i)=>{const b=document.createElement('label');b.innerHTML='<input type="checkbox" data-i="'+i+'"> '+r[0]+' ('+r[2]+'円)';dDiscounts.appendChild(b)});dOptions.innerHTML='';(DATA[c].options||[]).forEach((r,i)=>{const b=document.createElement('label');b.innerHTML='<input type="checkbox" data-i="'+i+'"> '+r[0]+' ('+r[1]+'円)';dOptions.appendChild(b)});dNetOpts.innerHTML='';(DATA[c].internets||[]).filter(r=>r[5]).forEach((r,i)=>{const b=document.createElement('label');b.innerHTML='<input type="checkbox" data-i="'+i+'"> '+r[5]+' ('+r[6]+'円)';dNetOpts.appendChild(b)});dPlan.onchange=fillData;dCat.onchange=fillDevices;dDevice.onchange=fillDeviceMeta;dCon.onchange=fillDeviceMeta;dIns.onchange=calcDetail;dData.onchange=calcDetail;dDevDisc.oninput=calcDetail;dNet.onchange=fillNetTypes;dNetType.onchange=calcDetail;[dDiscounts,dOptions,dNetOpts].forEach(x=>x.onchange=calcDetail);fillData();fillDevices();fillNetTypes();calcDetail()}function fillData(){const c=dCarrier.value,p=dPlan.value;const rows=plans(c).filter(r=>r[0]===p);opts(dData,rows.map(r=>String(r[1])+' ('+r[2]+'円)'),p?'データ量':'データ量');dData._rows=rows;calcDetail()}function fillDevices(){const c=dCarrier.value,cat=dCat.value;const rows=devices(c,cat);opts(dDevice,[...new Set(rows.map(r=>r[1]))],'機種選択');dDevice._rows=rows;fillDeviceMeta()}function fillDeviceMeta(){const rows=dDevice._rows||[],name=dDevice.value;const rs=rows.filter(r=>r[1]===name);opts(dIns,[...new Set(rs.map(r=>r[2]))].map(String),'回数');opts(dCon,[...new Set(rs.map(r=>r[3]))],'区分');calcDetail()}function fillNetTypes(){const c=dCarrier.value,n=dNet.value;const rows=(DATA[c]?.internets||[]).filter(r=>r[0]===n&&r[1]);dNetType.innerHTML='<option value="">区分</option>';rows.forEach((r,i)=>dNetType.appendChild(new Option(r[1]+' ('+r[2]+'円)',String(i))));dNetType._rows=rows;calcDetail()}function selectedPrices(box){return [...box.querySelectorAll('input:checked')].map(x=>Number(x.parentElement.textContent.match(/\((-?\d+)円\)/)?.[1]||0)}function calcDetail(){if(!DATA||!dCarrier.value)return;const c=dCarrier.value,p=dPlan.value,dr=dData._rows?.[dData.selectedIndex-1];let planPrice=dr?Number(dr[2])||0:0;let ins=Number(dIns.value)||0;const row=(dDevice._rows||[]).find(r=>r[1]===dDevice.value&&Number(r[2])===ins&&r[3]===dCon.value);let dev=0;if(row)dev=Math.max(0,(Number(row[4])||0)-Math.floor((Number(dDevDisc.value)||0)/24));let opt=selectedPrices(dOptions),disc=selectedPrices(dDiscounts).reduce((a,b)=>a+b,0),net=0;const nr=dNetType._rows?.[Number(dNetType.value)];if(nr)net=(Number(nr[2])||0)+(Number(nr[3])||0);const netDisc=selectedPrices(dNetOpts).reduce((a,b)=>a+b,0);const sum=Math.max(0,planPrice+dev+opt.reduce((a,b)=>a+b,0)+net+disc+netDisc);detailTotal.textContent=money(sum);calcNote.textContent='プラン '+money(planPrice)+' + 端末 '+money(dev)+' + オプション '+money(opt.reduce((a,b)=>a+b,0))+' + 固定回線 '+money(net)+' + 割引/セット割 '+money(disc+netDisc)+'（既存GAS料金マスタを参照）';return{carrier:c,plan:p,data:dData.value,device:dDevice.value,cat:dCat.value,con:dCon.value,ins:dIns.value,deviceAmount:dev,planAmount:planPrice,optAmount:opt.reduce((a,b)=>a+b,0),netAmount:net,discountAmount:disc+netDisc,total:sum}}function render(){body.innerHTML=proposals.map((p,pi)=>'<tr><td><b>'+p.name+'</b><br><span class="hint">'+p.note+'</span></td>'+p.cells.map((c,mi)=>'<td class="cell" onclick="openModal('+pi+','+mi+')"><div class="carrier">'+(c.carrier||'未設定')+'</div>'+(c.detail?.plan?'<div class="detail-line">'+c.detail.plan+(c.detail.device?' / '+c.detail.device:'')+'</div>':'')+'<div class="yen">'+money(c.amount)+'</div><div class="mode">'+(c.mode==='simple'?'簡易入力':'提案内容')+'</div></td>').join('')+'<td><b>'+money(total(p))+'</b><br><span class="delta '+(total(p)<=currentTotalValue()?'down':'up')+'">'+(total(p)<=currentTotalValue()?'▲':'▼')+money(Math.abs(total(p)-currentTotalValue()))+'/月</span><br><span class="hint">'+(total(p)<=currentTotalValue()?'▲':'▼')+money(Math.abs(total(p)-currentTotalValue())*12)+'/年</span></td></tr>').join('');monthlyBody.innerHTML=members.map((m,i)=>'<tr><td><b>'+m[0]+'</b></td><td>'+money(m[1])+'</td>'+proposals.map(p=>'<td>'+money(p.cells[i].amount)+'</td>').join('')+'</tr>').join('')+'<tr><td><b>家族総額</b></td><td><b>'+money(currentTotalValue())+'</b></td>'+proposals.map(p=>'<td><b>'+money(total(p))+'</b></td>').join('')+'</tr>';bottom.innerHTML=proposals.map(p=>'<div class="bi"><div class="bl">'+p.name+'</div><div class="bv">'+money(total(p))+'</div></div>').join('');const d=total(proposals[0])-currentTotalValue();bd.textContent=(d<=0?'▲':'▼')+money(Math.abs(d));bdy.textContent=(d<=0?'▲':'▼')+money(Math.abs(d)*12)}function currentTotalValue(){return members.reduce((a,m)=>a+m[1],0)}function setMode(m){document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('selected',b.dataset.mode===m));simpleBox.style.display=m==='simple'?'block':'none';detailBox.classList.toggle('open',m==='detail')}function openModal(pi,mi){edit=[pi,mi];const c=proposals[pi].cells[mi];title.textContent=proposals[pi].name+' / '+members[mi][0];carrierSimple.value=c.carrier||carrierNames()[0]||'';amount.value=c.amount||0;dCarrier.value=c.detail?.carrier||carrierNames()[0]||'';fillDetail();if(c.detail){dPlan.value=c.detail.plan||'';fillData();dData.value=c.detail.data||'';dCat.value=c.detail.cat||'SIMのみ';fillDevices();dDevice.value=c.detail.device||'';fillDeviceMeta();dCon.value=c.detail.con||'';dIns.value=c.detail.ins||''}setMode(c.mode||'simple');calcDetail();modalBg.classList.add('open')}function saveCell(){const mode=document.querySelector('.mode-btn.selected').dataset.mode;let c;if(mode==='simple')c={carrier:carrierSimple.value,amount:Number(amount.value)||0,mode:'simple',detail:{}};else{const d=calcDetail();c={carrier:d?.carrier||'',amount:d?.total||0,mode:'detail',detail:d||{}}}proposals[edit[0]].cells[edit[1]]=c;modalBg.classList.remove('open');render()}async function init(){try{const r=await fetch(GAS_URL,{redirect:'follow'});if(!r.ok)throw new Error('GAS HTTP '+r.status);DATA=await r.json();if(!DATA||typeof DATA!=='object')throw new Error('料金マスタの形式が不正です');opts(carrierSimple,carrierNames(),'キャリア選択');opts(dCarrier,carrierNames(),'キャリア選択');dCarrier.onchange=fillDetail;fillDetail();document.getElementById('loading').style.display='none';render()}catch(e){document.getElementById('loading').innerHTML='<div class="error">料金マスタの読み込みに失敗しました<br>'+e.message+'<br><small>既存Simulator202603と同じGAS URLを使用しています。</small></div>';console.error(e)}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});document.querySelectorAll('.mode-btn').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));cancel.onclick=()=>modalBg.classList.remove('open');save.onclick=saveCell;add.onclick=()=>{const n=proposals.length+1;proposals.push({name:'提案'+n,note:'新しい提案',cells:members.map(()=>({carrier:'',amount:0,mode:'simple',detail:{}}))});render()};copy.onclick=()=>{const p=proposals[0];proposals.push({name:'提案'+(proposals.length+1),note:p.name+'をコピー',cells:p.cells.map(c=>JSON.parse(JSON.stringify(c)))});render()};init();</script></body></html>
