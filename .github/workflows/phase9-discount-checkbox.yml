name: Phase9 discount checkbox patch

on:
  push:
    paths:
      - '.github/workflows/phase9-discount-checkbox.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Phase9 discount UI
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('phase9-ui-prototype.html')
          s=p.read_text()
          old='.discounts{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:6px}.discounts .select{font-size:11px}.discount-summary{line-height:1.7;text-align:left;font-size:12px}'
          new='.discounts{display:grid;grid-template-columns:repeat(2,minmax(150px,1fr));gap:6px;text-align:left}.discounts label{display:flex;align-items:center;gap:6px;font-size:12px;background:#fff0f3;border:1px solid #ffd6df;padding:6px 8px;border-radius:5px;cursor:pointer;line-height:1.35}.discounts label input{width:auto;margin:0;accent-color:var(--g)}.discounts label.is-disabled{opacity:.45;cursor:not-allowed}.discounts label.is-selected{font-weight:700;background:#eaf7f2;border-color:#9ed8c4}.discount-summary{line-height:1.7;text-align:left;font-size:12px}'
          if old not in s: raise SystemExit('CSS target not found')
          s=s.replace(old,new,1)
          pat=r"function discountUI\(s,pi,j\)\{.*?\}\nfunction proposalBlock"
          m=re.search(pat,s,re.S)
          if not m: raise SystemExit('discountUI target not found')
          newfunc='''function discountUI(s,pi,j){\n            const selected=[...(s.appliedDiscounts||[])].filter(Boolean).slice(0,5);\n            const names=uniq(discountRows(s.carrier).map(discountName));\n            if(!s.carrier)return'<span class="sub">キャリア選択後に表示</span>';\n            if(!names.length)return'<span class="sub">適用可能な割引なし</span>';\n            const html=names.map(name=>{\n              const checked=selected.includes(name);\n              const others=selected.filter(x=>x!==name);\n              const allowed=checked||discountAllowed(s,name,others);\n              const disabled=!checked&&(!allowed||selected.length>=5);\n              const price=discountDisplayPrice(s.carrier,name);\n              return`<label class="${checked?'is-selected ':''}${disabled?'is-disabled':''}"><input type="checkbox" class="p-discount" data-p="${pi}" data-j="${j}" value="${esc(name)}" ${checked?'checked':''} ${disabled?'disabled':''}><span>${esc(name)} (${price>0?'+':''}${price.toLocaleString()}円)</span></label>`;\n            }).join('');\n            return`<div class="discounts">${html}</div>`;\n          }\n          function proposalBlock'''
          s=s[:m.start()]+newfunc+s[m.end():]
          oldbind="document.querySelectorAll('.p-discount').forEach(e=>e.onchange=()=>{const s=proposals[+e.dataset.p].lines[+e.dataset.j],slot=+e.dataset.slot;const next=e.value;const arr=[...(s.appliedDiscounts||[])];while(arr.length<5)arr.push('');arr[slot]=next;const cleaned=arr.filter(Boolean);s.appliedDiscounts=cleaned.slice(0,5);calcLine(s);renderProposal();renderCompare()});"
          newbind="document.querySelectorAll('.p-discount').forEach(e=>e.onchange=()=>{const s=proposals[+e.dataset.p].lines[+e.dataset.j],name=e.value;const arr=[...(s.appliedDiscounts||[])].filter(Boolean);if(e.checked){if(!arr.includes(name)&&arr.length<5)arr.push(name)}else{s.appliedDiscounts=arr.filter(x=>x!==name);calcLine(s);renderProposal();renderCompare();return}s.appliedDiscounts=arr.slice(0,5);calcLine(s);renderProposal();renderCompare()});"
          if oldbind not in s: raise SystemExit('bind target not found')
          s=s.replace(oldbind,newbind,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase9-ui-prototype.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: change proposal discounts to exclusive checkboxes'
          git push
