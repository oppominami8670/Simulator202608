name: Phase9 UI patch

on:
  push:
    paths:
      - '.github/workflows/phase9-ui-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'github-actions[bot]' || github.event.before != github.sha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch Phase9 UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('phase9-ui-prototype.html')
          s = p.read_text(encoding='utf-8')

          old = '''.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.note{background:#fff;border:1px solid var(--b);border-radius:8px}'''
          new = '''.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.current-memo{margin-top:16px}.delete-btn{border:1px solid #e2b8b8;background:#fff;color:#c43d3d;border-radius:5px;padding:4px 8px;font-size:11px;font-weight:700;cursor:pointer}.delete-btn:disabled{opacity:.35;cursor:not-allowed}.line-head{display:flex;align-items:center;justify-content:center;gap:6px}.proposal-head{display:flex;align-items:center;justify-content:center;gap:6px}.note{background:#fff;border:1px solid var(--b);border-radius:8px}'''
          assert old in s, 'CSS anchor not found'
          s = s.replace(old, new, 1)

          old = '''<section id="current" class="panel active"><div class="head"><div><h2>現在の契約状況</h2><div class="sub"></div></div><button class="btn primary" id="addLine">＋ 回線を増やす</button></div><div class="wrap"><table class="table"><thead><tr id="currentHead"></tr></thead><tbody id="currentBody"></tbody></table></div></section>'''
          new = '''<section id="current" class="panel active"><div class="head"><div><h2>現在の契約状況</h2><div class="sub"></div></div><button class="btn primary" id="addLine">＋ 回線を増やす</button></div><div class="wrap"><table class="table"><thead><tr id="currentHead"></tr></thead><tbody id="currentBody"></tbody></table></div><div class="note current-memo"><h3>MEMO</h3><textarea id="currentMemo" placeholder="現在の契約状況に関するメモを入力"></textarea></div></section>'''
          assert old in s, 'current section anchor not found'
          s = s.replace(old, new, 1)

          old = '''let GLOBAL_DATA=null,lines=['A'];'''
          new = '''let GLOBAL_DATA=null,lines=['A'],currentMemo='';'''
          assert old in s, 'state anchor not found'
          s = s.replace(old, new, 1)

          old = '''function renderCurrent(){document.getElementById('currentHead').innerHTML='<th class="label">項目</th>'+lines.map(x=>`<th>${x}</th>`).join('')+'<th>固定回線</th>';const rows=['キャリア','プラン','端末','残債','支払残数','月額'];document.getElementById('currentBody').innerHTML=rows.map(label=>`<tr><td class="label">${label}</td>${lines.map((_,i)=>currentInput(i,label)).join('')}<td>${fixedInput(label).replace(/^<td>|<\\/td>$/g,'')}</td></tr>`).join('');bindCurrent();renderProposal();renderCompare()}'''
          new = '''function renderCurrent(){document.getElementById('currentHead').innerHTML='<th class="label">項目</th>'+lines.map((x,i)=>`<th><div class="line-head"><span>${x}</span><button class="delete-btn line-delete" data-line="${i}" ${lines.length===1?'disabled':''}>削除</button></div></th>`).join('')+'<th>固定回線</th>';const rows=['キャリア','プラン','端末','残債','支払残数','月額'];document.getElementById('currentBody').innerHTML=rows.map(label=>`<tr><td class="label">${label}</td>${lines.map((_,i)=>currentInput(i,label)).join('')}<td>${fixedInput(label).replace(/^<td>|<\\/td>$/g,'')}</td></tr>`).join('');const memo=document.getElementById('currentMemo');if(memo)memo.value=currentMemo;bindCurrent();renderProposal();renderCompare()}'''
          assert old in s, 'renderCurrent anchor not found'
          s = s.replace(old, new, 1)

          old = '''function bindCurrent(){document.querySelectorAll('.cur-carrier').forEach((e,i)=>e.onchange=()=>{currentState[i].carrier=e.value;currentState[i].plan='';renderCurrent()});'''
          new = '''function bindCurrent(){document.querySelectorAll('.line-delete').forEach(e=>e.onclick=()=>{const i=+e.dataset.line;if(lines.length<=1)return;lines.splice(i,1);currentState.splice(i,1);proposals.forEach(p=>p.lines.splice(i,1));renderCurrent()});const memo=document.getElementById('currentMemo');if(memo)memo.oninput=()=>{currentMemo=memo.value};document.querySelectorAll('.cur-carrier').forEach((e,i)=>e.onchange=()=>{currentState[i].carrier=e.value;currentState[i].plan='';renderCurrent()});'''
          assert old in s, 'bindCurrent anchor not found'
          s = s.replace(old, new, 1)

          old = '''function proposalBlock(p,pi){return`<div class="wrap" style="margin-bottom:14px"><table class="table"><thead><tr><th>提案${circled[pi]||pi+1}</th>${lines.map(x=>`<th>${x}</th>`).join('')}<th>固定回線</th><th>合計</th></tr></thead><tbody>'''
          new = '''function proposalBlock(p,pi){return`<div class="wrap" style="margin-bottom:14px"><table class="table"><thead><tr><th><div class="proposal-head"><span>提案${circled[pi]||pi+1}</span><button class="delete-btn proposal-delete" data-p="${pi}" ${proposals.length===1?'disabled':''}>削除</button></div></th>${lines.map(x=>`<th>${x}</th>`).join('')}<th>固定回線</th><th>合計</th></tr></thead><tbody>'''
          assert old in s, 'proposalBlock anchor not found'
          s = s.replace(old, new, 1)

          old = '''function renderProposal(){document.getElementById('proposalArea').innerHTML=proposals.map(proposalBlock).join('');bindProposal()}'''
          new = '''function renderProposal(){document.getElementById('proposalArea').innerHTML=proposals.map(proposalBlock).join('');bindProposal();document.querySelectorAll('.proposal-delete').forEach(e=>e.onclick=()=>{const i=+e.dataset.p;if(proposals.length<=1)return;proposals.splice(i,1);renderProposal();renderCompare()})}'''
          assert old in s, 'renderProposal anchor not found'
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase9-ui-prototype.html
          git diff --cached --check
          git commit -m 'feat: add current memo and delete controls to Phase9'
          git push origin main
