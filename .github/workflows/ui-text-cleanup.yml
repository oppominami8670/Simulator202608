name: Phase9 UI text cleanup
on:
  push:
    paths:
      - '.github/workflows/ui-text-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update requested labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('phase9-ui-prototype.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('適用割引（最大5つ）','適用割引')
          s=s.replace('キャリア → プラン → データ量 → 区分 → 端末種別 → 端末 → 分割 → オプション → 適用割引','')
          s=s.replace('契約回線をA・B・C…として管理。家族構成は仮定しません。','')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase9-ui-prototype.html
          git diff --cached --quiet || git commit -m 'fix: clean up Phase9 UI labels'
          git push
