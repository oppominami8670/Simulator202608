name: Copy Phase9 baseline to index
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy Phase9 to index
        run: cp phase9-ui-prototype.html index.html
      - name: Commit index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'sync: baseline phase9 to index'
          git push
