name: Simulator regression test
on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - 'phase9.html'
      - 'tests/**'
      - '.github/workflows/regression.yml'
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified Phase 9 fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('phase9.html')
          s = p.read_text()
          old = "[...new Set(rows.map(x=>x[2])).map(x=>[x,`${x}回`])]"
          new = "[...new Set(rows.map(x=>x[2]))].map(x=>[x,`${x}回`])"
          if old not in s:
              raise SystemExit('verified bug pattern not found; no automatic patch applied')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase9.html
          git commit -m "fix: correct installment option list construction"
          git push origin HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install chromium
      - run: node tests/diagnose-calc.mjs
      - run: node tests/regression-fixed.mjs
      - run: node tests/numerical-parity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report
          path: |
            regression-report.json
            numerical-parity-report.json
            calc-diagnostic.json
