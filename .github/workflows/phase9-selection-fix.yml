name: Phase9 selection fix

on:
  push:
    branches: [fix/phase9-selection]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Phase9 selectors to match Simulator202603
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('phase9.html')
          s = p.read_text(encoding='utf-8')
          rules = [
            ('''function loadIns(){const c=val("carrier"),cat=val("category"),rows=(GLOBAL_DATA[c]?.devices||[]).filter(x=>x[0]===cat&&x[1]===val("device"));opts($('ins'),[...new Set(rows.map(x=>x[2]))].map(x=>[x,`${x}回`]));loadCon()}''', '''function loadIns(){const c=val("carrier"),rows=(GLOBAL_DATA[c]?.devices||[]).filter(x=>x[1]===val("device"));opts($('ins'),[...new Set(rows.map(x=>x[2]))].map(x=>[x,`${x}回`]));loadCon()}'''),
            ('''function loadCon(){const c=val("carrier"),cat=val("category"),rows=(GLOBAL_DATA[c]?.devices||[]).filter(x=>x[0]===cat&&x[1]===val("device")&&String(x[2])===String(val("ins")));$('con').innerHTML='<option value="">区分</option>';const lm={mnp:"MNP",new:"新規",standalone:"機種変更"};[...new Map(rows.map(x=>[x[3],x])).values()].forEach(x=>$('con').appendChild(new Option(lm[x[3]]||x[3],x[3])));loadOptions()}''', '''function loadCon(){const c=val("carrier"),rows=(GLOBAL_DATA[c]?.devices||[]).filter(x=>x[1]===val("device")&&x[2]==val("ins"));$('con').innerHTML='<option value="">区分</option>';const lm={mnp:"MNP",new:"新規",standalone:"機種変更"};rows.forEach(x=>$('con').appendChild(new Option(lm[x[3]]||x[3],x[3])));loadOptions()}'''),
            ('''function loadOptions(){const c=val('carrier'),cat=val('category'),rows=GLOBAL_DATA[c]?.devices||[],r=rows.find(x=>x[0]===cat&&x[1]===val('device')&&String(x[2])===String(val('ins'))&&x[3]===val('con'));$('options').innerHTML='';state.options=new Map();if(r&&parseInt(r[6])>0)addOption(`端末補償(+${r[6]})`,r[6],'HOSHO');(GLOBAL_DATA[c]?.options||[]).forEach(o=>addOption(`${o[0]}(+${o[1]})`,o[1],o[0]));calc()}''', '''function loadOptions(){const c=val('carrier'),rows=GLOBAL_DATA[c]?.devices||[],r=rows.find(x=>x[1]===val('device')&&x[2]==val('ins')&&x[3]===val('con'));$('options').innerHTML='';state.options=new Map();if(r&&parseInt(r[6])>0)addOption(`端末補償(+${r[6]})`,r[6],'HOSHO');(GLOBAL_DATA[c]?.options||[]).forEach(o=>addOption(`${o[0]}(+${o[1]})`,o[1],o[0]));calc()}'''),
          ]
          for old, new in rules:
              if old not in s:
                  raise SystemExit('Expected Phase9 selector rule not found')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patched Phase9
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase9.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: match legacy GAS selector and option rules'
          git push