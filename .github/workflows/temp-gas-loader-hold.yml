name: temp-gas-loader-hold
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'chore: hold loader until GAS ready'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Phase9 loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('phase9-ui-prototype.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- PHASE9_GAS_LOADER_HOLD -->'
          if marker in s:
              raise SystemExit(0)
          inject='''<!-- PHASE9_GAS_LOADER_HOLD -->\n<script>\n(() => {\n  const screen = document.getElementById('loading-screen');\n  if (!screen) return;\n  const ready = () => window.GLOBAL_DATA !== null && typeof window.GLOBAL_DATA !== 'undefined';\n  const guard = new MutationObserver(() => {\n    if (screen.classList.contains('is-loaded') && !ready()) screen.classList.remove('is-loaded');\n  });\n  guard.observe(screen, { attributes: true, attributeFilter: ['class'] });\n  const timer = setInterval(() => {\n    if (ready()) {\n      clearInterval(timer);\n      setTimeout(() => screen.classList.add('is-loaded'), 350);\n      guard.disconnect();\n    }\n  }, 50);\n})();\n</script>\n'''
          s=s.replace('</body>', inject+'</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase9-ui-prototype.html
          git commit -m 'chore: hold loader until GAS ready'
          git push
