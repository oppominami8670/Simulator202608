name: temp-gas-loader-hold
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Phase9 loader
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$COMMIT_MESSAGE" = "chore: hold loader until GAS ready" ]; then exit 0; fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('phase9-ui-prototype.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- PHASE9_GAS_LOADER_HOLD -->'
          if marker in s:
              raise SystemExit(0)
          inject='''<!-- PHASE9_GAS_LOADER_HOLD -->
          <script>
          (() => {
            const screen = document.getElementById('loading-screen');
            if (!screen) return;
            const ready = () => window.GLOBAL_DATA !== null && typeof window.GLOBAL_DATA !== 'undefined';
            const guard = new MutationObserver(() => {
              if (screen.classList.contains('is-loaded') && !ready()) screen.classList.remove('is-loaded');
            });
            guard.observe(screen, { attributes: true, attributeFilter: ['class'] });
            const timer = setInterval(() => {
              if (ready()) {
                clearInterval(timer);
                setTimeout(() => screen.classList.add('is-loaded'), 350);
                guard.disconnect();
              }
            }, 50);
          })();
          </script>
          '''
          s=s.replace('</body>', inject+'</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase9-ui-prototype.html
          git diff --cached --quiet && exit 0
          git commit -m 'chore: hold loader until GAS ready'
          git push
