<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>料金シミュレーター Phase 9</title><style>html,body{height:100%;margin:0;overflow:hidden}body{font-family:Meiryo,sans-serif;background:#f4f6f8;color:#20242a}*{box-sizing:border-box}.app{height:100vh;display:grid;grid-template-rows:58px 48px minmax(0,1fr) 68px}.header,.tabs,.bottom{background:#fff;border-bottom:1px solid #d9dee5}.header{display:flex;align-items:center;padding:0 24px;font-size:20px;font-weight:700}.header small{margin-left:12px;font-size:12px;color:#69717d;font-weight:400}.tabs{display:flex;padding-left:24px}.tab{height:48px;padding:0 28px;border:0;background:#fff;color:#69717d;font-weight:700;border-bottom:3px solid transparent;cursor:pointer}.tab.active{color:#087f5b;background:#eaf7f2;border-bottom-color:#087f5b}.main{min-height:0;padding:14px 20px 10px;overflow:hidden}.panel{height:100%;display:none}.panel.active{display:flex;flex-direction:column;min-height:0}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.head h2{margin:0;font-size:17px}.hint{font-size:12px;color:#69717d}.tools{display:flex;gap:8px}.btn{border:1px solid #d9dee5;background:#fff;border-radius:6px;padding:7px 12px;font-weight:700;cursor:pointer}.primary{background:#087f5b;color:#fff;border-color:#087f5b}.wrap{flex:1;min-height:0;overflow:auto;background:#fff;border:1px solid #d9dee5;border-radius:8px}.table{width:100%;border-collapse:collapse}.table th,.table td{border:1px solid #d9dee5;padding:7px;text-align:center;vertical-align:middle}.table th{background:#f8fafb;font-size:12px}.cell{cursor:pointer}.cell:hover{background:#eaf7f2}.carrier{font-weight:700;color:#087f5b}.sub{font-size:11px;color:#69717d}.yen{font-size:16px;font-weight:700}.down{color:#087f5b}.up{color:#c43d3d}.bottom{border-top:1px solid #d9dee5;border-bottom:0;display:flex;align-items:center;padding:8px 20px;overflow:hidden}.bi{padding:0 18px;border-right:1px solid #d9dee5;white-space:nowrap}.bi:first-child{padding-left:0}.bl{font-size:11px;color:#69717d}.bv{font-size:18px;font-weight:700}.modal-bg{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:10}.modal-bg.open{display:flex}.modal{width:min(94vw,980px);max-height:92vh;overflow:auto;background:#fff;border-radius:10px;padding:18px}.modal h3{margin:0 0 12px}.modebar{display:flex;gap:8px;margin-bottom:12px}.modebtn{flex:1;padding:10px;border:1px solid #d9dee5;background:#fff;border-radius:7px;font-weight:700;cursor:pointer}.modebtn.active{border:2px solid #087f5b;background:#eaf7f2}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.field label{display:block;font-size:11px;color:#69717d;margin-bottom:4px}.field select,.field input{width:100%;padding:8px;border:1px solid #d9dee5;border-radius:6px;font:inherit}.box{background:#f8fafb;border:1px solid #d9dee5;border-radius:8px;padding:10px;margin-bottom:10px}.discgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.opt{padding:6px 8px;border:1px solid #d9dee5;background:#fff;border-radius:6px;font-size:11px;cursor:pointer}.opt.active{border-color:#087f5b;background:#eaf7f2}.summary{padding:12px;background:#eaf7f2;border-radius:7px}.summary strong{font-size:21px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}</style></head><body><div class="app"><header class="header">料金シミュレーター <small>Phase 9 / Simulator202603計算ロジック準拠</small></header><nav class="tabs"><button class="tab active" data-tab="proposal">比較・提案</button><button class="tab" data-tab="monthly">月額料金</button></nav><main class="main"><section id="proposal" class="panel active"><div class="head"><div><h2>比較・提案</h2><div class="hint">簡易入力または既存Simulator202603と同じ計算ロジックで提案を作成</div></div><div class="tools"><button id="add" class="btn primary">＋ 提案を追加</button><button id="copy" class="btn">コピー</button></div></div><div class="wrap"><table class="table"><thead><tr><th>提案</th><th>父<br><span class="sub">現在 ¥8,500</span></th><th>母<br><span class="sub">現在 ¥6,500</span></th><th>長男<br><span class="sub">現在 ¥3,500</span></th><th>長女<br><span class="sub">現在 ¥1,000</span></th><th>家族総額 / 増減</th></tr></thead><tbody id="proposalBody"></tbody></table></div></section><section id="monthly" class="panel"><div class="head"><h2>月額料金</h2><span class="hint">回線毎・家族総額 / 1-24(または36)ヶ月・それ以降</span></div><div class="wrap"><table class="table"><thead><tr><th>家族</th><th>現在</th><th>提案①</th><th>提案②</th><th>提案③</th></tr></thead><tbody id="monthlyBody"></tbody></table></div></section></main><footer class="bottom"><div class="bi"><div class="bl">現在</div><div class="bv">¥19,500</div></div><div id="bottom"></div><div class="bi"><div class="bl">増減（月額）</div><div id="bd" class="bv"></div></div><div class="bi"><div class="bl">増減（年額）</div><div id="bdy" class="bv"></div></div></footer></div><div id="modalBg" class="modal-bg"><div class="modal"><h3 id="modalTitle"></h3><div class="modebar"><button class="modebtn active" data-mode="simple">簡易入力：月額合計を直接入力</button><button class="modebtn" data-mode="engine">既存計算：キャリア・プラン・機種を選択</button></div><div id="simpleArea" class="box"><div class="grid4"><div class="field"><label>キャリア</label><select id="simpleCarrier"><option>docomo</option><option>au</option><option>SoftBank</option><option>楽天</option><option>UQ</option><option>Y!mobile</option><option>その他</option></select></div><div class="field"><label>月額合計</label><input id="simpleAmount" type="number" min="0" step="100"></div></div></div><div id="engineArea" style="display:none"><div class="box"><div class="grid4"><div class="field"><label>キャリア</label><select id="carrier"></select></div><div class="field"><label>機種カテゴリ</label><select id="category"><option value="iPhone">iPhone</option><option value="Android">Android</option><option value="SIMのみ">SIMのみ</option></select></div><div class="field"><label>機種</label><select id="device"></select></div><div class="field"><label>端末支払回数</label><select id="ins"></select></div><div class="field"><label>契約区分</label><select id="con"></select></div><div class="field"><label>端末値引き総額</label><input id="devDisc" type="number" min="0" value="0"></div><div class="field"><label>料金プラン</label><select id="plan"></select></div><div class="field"><label>データ容量</label><select id="data"></select></div></div></div><div class="box"><div class="field"><label>適用割引（既存Simulatorと同じ5枠・排他条件）</label><div id="discounts" class="discgrid"></div></div></div><div class="box"><div class="field"><label>端末保証・追加オプション</label><div id="options" class="discgrid"></div></div></div><div class="box"><div class="grid4"><div class="field"><label>固定回線</label><select id="net"></select></div><div class="field"><label>固定回線区分</label><select id="netType"></select></div></div><div class="field"><label>固定回線・ネット割引</label><div id="netOpts" class="discgrid"></div></div></div><div class="summary"><div>既存Simulator計算結果</div><strong id="engineTotal">¥0</strong><div class="sub" id="laterTotal"></div><div class="sub" id="breakdown"></div></div></div><div class="actions"><button id="cancel" class="btn">キャンセル</button><button id="save" class="btn primary">保存</button></div></div></div><script>const GAS_URL="https://script.google.com/macros/s/AKfycbxUj8Ojmgq2H-weGZRui_rdi9W6_y6QSUjbjKY1Lr89IsErmVNqxYZx_walEIs3QoaA/exec";const EXCLUSIVE_GROUPS={UQ:[["自宅セット","家族セット"]],"Y!mobile":[["家族割引","おうち割 光セット","おうち割 でんきセット"],["PayPayカード割 ゴールド","PayPayカード割"]],softbank:[]};let GLOBAL_DATA=null,mode="simple",edit=[0,0];const members=[["父",8500],["母",6500],["長男",3500],["長女",1000]],current=19500,money=n=>"¥"+Math.round(Number(n)||0).toLocaleString("ja-JP");let proposals=[1,2,3].map((n,i)=>({name:`提案${String.fromCharCode(9311+i)}`,note:["auへまとめる","au＋UQ","楽天へまとめる"][i],cells:members.map(()=>({amount:0,carrier:["au","UQ","楽天"][i],type:"simple"}))}));let state={discounts:[],options:new Map(),netOpts:new Map(),netMain:[0,0]};const $=id=>document.getElementById(id);function opts(el,arr,ph){el.innerHTML=ph?`<option value="">${ph}</option>`:"";arr.forEach(v=>el.appendChild(new Option(Array.isArray(v)?v[0]:v,Array.isArray(v)?v[1]:v)))}async function init(){try{const r=await fetch(GAS_URL,{redirect:"follow"});if(!r.ok)throw Error(r.status);GLOBAL_DATA=await r.json();opts($('carrier'),Object.keys(GLOBAL_DATA),"キャリア選択");render()}catch(e){console.error(e);alert("料金マスタ取得エラー");render()}}function loadCarrier(){const c=val("carrier");if(!c)return;state.masterDiscounts=GLOBAL_DATA[c].discounts||[];opts($('plan'),[...new Set(GLOBAL_DATA[c].plans.map(x=>x[0]))],"プラン選択");opts($('net'),[...new Set(GLOBAL_DATA[c].internets.map(x=>x[0]))],"固定回線なし");loadDevices();loadNetTypes();updateNetOpts();refreshDiscounts()}function val(id){return $(id).value}function loadDevices(){const c=val("carrier"),cat=val("category"),rows=(GLOBAL_DATA[c]?.devices||[]).filter(x=>x[0]===cat);opts($('device'),[...new Set(rows.map(x=>x[1]))],"機種選択");loadIns()}function loadIns(){const c=val("carrier"),rows=(GLOBAL_DATA[c]?.devices||[]).filter(x=>x[1]===val("device"));opts($('ins'),[...new Set(rows.map(x=>x[2]))].map(x=>[x,`${x}回`]));loadCon()}function loadCon(){const c=val("carrier"),rows=(GLOBAL_DATA[c]?.devices||[]).filter(x=>x[1]===val("device")&&x[2]==val("ins"));$('con').innerHTML='<option value="">区分</option>';const lm={mnp:"MNP",new:"新規",standalone:"機種変更"};rows.forEach(x=>$('con').appendChild(new Option(lm[x[3]]||x[3],x[3])));loadOptions()}function loadPlan(){const c=val("carrier"),rows=(GLOBAL_DATA[c]?.plans||[]).filter(x=>x[0]===val("plan"));$('data').innerHTML='<option value="0">データ量</option>';rows.forEach(x=>$('data').appendChild(new Option(`${x[1]} (${x[2]}円)`,x[2])));refreshDiscounts();calc()}function refreshDiscounts(){const c=val("carrier"),p=val("plan"),master=GLOBAL_DATA?.[c]?.discounts||[],old=[...$('discounts').querySelectorAll('select')].map(x=>x.value);$('discounts').innerHTML='';for(let i=0;i<5;i++){const s=document.createElement('select');s.innerHTML='<option value="0">割引なし</option>';const others=[...$('discounts').querySelectorAll('select')].map(x=>x.value.split('_')[0]).filter(x=>x&&x!=="0");master.forEach(d=>{let n=d[0],price=parseInt(d[2])||0;if(c==='Rakuten'){const a=["最強家族割","最強こども割","最強青春割","最強シニアプログラム"];if(!a.some(x=>n.includes(x)))return;if(others.some(x=>x.includes('最強シニアプログラム'))&&(n.includes('最強こども割')||n.includes('最強青春割')))return;if(n.includes('最強シニアプログラム')&&others.some(x=>x.includes('最強こども割')||x.includes('最強青春割')))return}if(c==='Y!mobile'){if(n.includes('親子割')&&p.includes('シンプル3 S'))return;if(p.includes('シンプル3 S')&&n.includes('でんきセット'))return}if(c==='docomo'){if(p.includes('ahamo'))return;if(p.includes('ドコモポイ活MAX20')&&n.includes('長期利用割'))return;if(p.includes('ドコモmini')&&!['ドコモ光セット','home 5G','dカード割','ドコモでんき'].some(x=>n.includes(x)))return}if(c==='au'){if(p.includes('U12バリュー')&&!['U12家族割','カードお支払い割'].some(x=>n.includes(x)))return;if(n.includes('U12家族割')&&!p.includes('U12バリュー'))return;if(p.includes('マネ活2')&&(n.includes('カードお支払い割')||n.includes('家族割プラス')))return;if(p.includes('シニアバリュー')&&n.includes('家族割プラス'))return}if(others.includes(n))return;let ok=true;(EXCLUSIVE_GROUPS[c]||[]).forEach(g=>{if(g.some(x=>n.includes(x))&&others.some(o=>g.some(x=>o.includes(x))))ok=false});if(ok)s.appendChild(new Option(`${n}(${price}円)`,`${n}_${price}`))});s.value=old[i]||"0";s.onchange=()=>{autoOption(s.value);refreshDiscounts();calc()};$('discounts').appendChild(s)}}function autoOption(v){if(!v)return;const n=v.split('_')[0];if(n.includes('最強こども割')||n.includes('最強青春割')){[...$('options').querySelectorAll('.opt')].forEach(b=>{if(b.textContent.includes('あんしんコントロール')&&!b.classList.contains('active'))b.click()})}}function loadOptions(){const c=val('carrier'),rows=GLOBAL_DATA[c]?.devices||[],r=rows.find(x=>x[1]===val('device')&&x[2]==val('ins')&&x[3]===val('con'));$('options').innerHTML='';state.options=new Map();if(r&&parseInt(r[6])>0)addOption(`端末補償(+${r[6]})`,r[6],'HOSHO');(GLOBAL_DATA[c]?.options||[]).forEach(o=>addOption(`${o[0]}(+${o[1]})`,o[1],o[0]));calc()}function addOption(label,price,key){const b=document.createElement('button');b.className='opt';b.textContent=label;b.onclick=()=>{b.classList.toggle('active');b.classList.contains('active')?state.options.set(key,price):state.options.delete(key);calc()};$('options').appendChild(b)}function updateNetOpts(){const c=val('carrier');$('netOpts').innerHTML='';const added=new Set();(GLOBAL_DATA[c]?.internets||[]).forEach(r=>{if(r[5]&&!added.has(r[5])){const b=document.createElement('button');b.className='opt';b.textContent=`${r[5]}(+${r[6]})`;b.onclick=()=>handleNet(b,r[5],r[6]);$('netOpts').appendChild(b);added.add(r[5])}})}function handleNet(b,n,p){const c=val('carrier'),groups={UQ:['自宅セット割','家族セット割'],"Y!mobile":['おうち割 光セット(A)','家族割引'],docomo:['ドコモ光セット割','みんなドコモ割'],au:['auスマートバリュー','家族割プラス'],softbank:['おうち割 光セット','新みんな家族割']};if(groups[c]?.includes(n))$('netOpts').querySelectorAll('.opt').forEach(x=>{const nm=x.textContent.split('(')[0];if(groups[c].includes(nm)&&x!==b){x.classList.remove('active');state.netOpts.delete(nm)}});b.classList.toggle('active');b.classList.contains('active')?state.netOpts.set(n,p):state.netOpts.delete(n);calc()}function loadNetTypes(){const rows=(GLOBAL_DATA[val('carrier')]?.internets||[]).filter(r=>r[0]===val('net')&&r[1]!=="");$('netType').innerHTML='<option value="">区分</option>';rows.forEach((r,i)=>$('netType').appendChild(new Option(`${r[1]}(${r[2]}円)`,i)));$('netType').disabled=false;updateNet()}function updateNet(){const rows=(GLOBAL_DATA[val('carrier')]?.internets||[]).filter(r=>r[0]===val('net')&&r[1]!=="");const r=rows[val('netType')];state.netMain=r?[parseInt(r[2])||0,parseInt(r[2])||0]:[0,0];if(r)state.netMain=[(parseInt(r[2])||0)+(parseInt(r[3])||0),parseInt(r[2])||0];calc()}function calc(){const c=val('carrier'),pName=val('plan'),insValue=parseInt(val('ins'))||24,planP=parseInt(val('data'))||0,dataLabel=$('data').options[$('data').selectedIndex]?.text||"",devDInput=parseInt(val('devDisc'))||0,devD=Math.floor(devDInput/24),threshold=insValue===36?36:24;let d1=0,d2=0;const r=(GLOBAL_DATA[c]?.devices||[]).find(x=>x[1]===val('device')&&x[2]==insValue&&x[3]===val('con'));if(r){d1=Math.max(0,(parseInt(r[4])||0)-devD);d2=parseInt(r[5])||0}let optT=0;state.options.forEach(v=>optT+=parseInt(v)||0);let netT=0;state.netOpts.forEach(v=>netT+=parseInt(v)||0);let baseDisc1=0,baseDisc2=0,selected=[];[...$('discounts').querySelectorAll('select')].forEach(s=>{const z=s.value;if(z&&z!=="0"){let n=z.split('_')[0],price=parseInt(z.split('_')[1])||0;if(c==='au'){if(n.includes('スマートバリュー'))price=pName.includes('U18バリュー')?-550:-1100;if(pName.includes('U18バリュー')&&n.includes('家族割プラス'))price=(Math.abs(price)===1210)?-550:-220}if(c==='UQ'&&pName.includes('トクトク')&&n.includes('親子応援割'))if(dataLabel.includes('~5GB'))price=-550;if(c==='Rakuten'&&n.includes('最強こども割')){if(pName.includes('最強U-NEXTプラン'))price=-110;else if(pName.includes('最強プラン'))price=dataLabel.includes('~3GB')?-440:-110}const LIMITED=['1年おトク割+','デビュー特典','応援割','親子割'],lim=LIMITED.some(x=>n.includes(x));baseDisc1+=price;if(!lim)baseDisc2+=price;selected.push(n)}});let bonus=0;if(c==='Rakuten'){const senior=selected.some(x=>x.includes('シニア'));const ok=[...state.options.keys()];if(senior&&ok.some(n=>/通話/.test(n))&&ok.some(n=>/操作サポート/.test(n))&&ok.some(n=>/Whoscall/.test(n)))bonus=-880}const final1=baseDisc1+bonus,final2=baseDisc2+(bonus||0),t1=Math.max(0,planP+d1+optT+state.netMain[0]+netT+final1),t2=Math.max(0,planP+d2+optT+state.netMain[1]+netT+final2);$('engineTotal').textContent=money(t1);$('laterTotal').textContent=`${threshold+1}ヶ月目以降: ${money(t2)}`;$('breakdown').textContent=`プラン ${money(planP)} / 端末 ${money(d1)} / オプション ${money(optT)} / ネット ${money(state.netMain[0]+netT)} / 割引 ${money(final1)}`;return{first:t1,later:t2}}function openModal(pi,mi){edit=[pi,mi];const c=proposals[pi].cells[mi];$('modalTitle').textContent=`${proposals[pi].name} / ${members[mi][0]}`;setMode(c.type||'simple');$('simpleCarrier').value=c.carrier||'docomo';$('simpleAmount').value=c.amount||0;$('modalBg').classList.add('open')}function setMode(m){mode=m;document.querySelectorAll('.modebtn').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));$('simpleArea').style.display=m==='simple'?'block':'none';$('engineArea').style.display=m==='engine'?'block':'none';if(m==='engine'&&GLOBAL_DATA)opts($('carrier'),Object.keys(GLOBAL_DATA),'キャリア選択')}function save(){let c;if(mode==='simple')c={amount:Number($('simpleAmount').value)||0,carrier:$('simpleCarrier').value,type:'simple'};else{const r=calc();c={amount:r.first,later:r.later,carrier:val('carrier'),type:'engine',state:{carrier:val('carrier'),category:val('category'),device:val('device'),ins:val('ins'),con:val('con'),devDisc:val('devDisc'),plan:val('plan'),data:val('data')}}}proposals[edit[0]].cells[edit[1]]=c;$('modalBg').classList.remove('open');render()}function total(p){return p.cells.reduce((s,c)=>s+(Number(c.amount)||0),0)}function render(){$('proposalBody').innerHTML=proposals.map((p,pi)=>`<tr><td><b>${p.name}</b><br><span class="sub">${p.note}</span></td>`+p.cells.map((c,mi)=>`<td class="cell" onclick="openModal(${pi},${mi})"><div class="carrier">${c.carrier||'未設定'}</div>${c.state?.plan?`<div class="sub">${c.state.plan}${c.state.device?` / ${c.state.device}`:''}</div>`:''}<div class="yen">${money(c.amount)}</div><div class="sub">${c.type==='engine'?'既存計算':'簡易入力'}</div></td>`).join('')+`<td><b>${money(total(p))}</b><br><span class="${total(p)<=current?'down':'up'}">${total(p)<=current?'▲':'▼'}${money(Math.abs(total(p)-current))}/月</span><br><span class="sub">${total(p)<=current?'▲':'▼'}${money(Math.abs(total(p)-current)*12)}/年</span></td></tr>`).join('');$('monthlyBody').innerHTML=members.map((m,i)=>`<tr><td><b>${m[0]}</b></td><td>${money(m[1])}</td>${proposals.map(p=>`<td>${money(p.cells[i].amount)}</td>`).join('')}</tr>`).join('')+`<tr><td><b>家族総額</b></td><td><b>${money(current)}</b></td>${proposals.map(p=>`<td><b>${money(total(p))}</b></td>`).join('')}</tr>`;$('bottom').innerHTML=proposals.map(p=>`<div class="bi"><div class="bl">${p.name}</div><div class="bv">${money(total(p))}</div></div>`).join('');const d=total(proposals[0])-current;$('bd').textContent=(d<=0?'▲':'▼')+money(Math.abs(d));$('bdy').textContent=(d<=0?'▲':'▼')+money(Math.abs(d)*12)}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});document.querySelectorAll('.modebtn').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$('carrier').onchange=loadCarrier;$('category').onchange=loadDevices;$('device').onchange=loadIns;$('ins').onchange=loadCon;$('con').onchange=loadOptions;$('plan').onchange=loadPlan;$('data').onchange=calc;$('devDisc').oninput=calc;$('net').onchange=loadNetTypes;$('netType').onchange=updateNet;$('cancel').onclick=()=>$('modalBg').classList.remove('open');$('save').onclick=save;$('add').onclick=()=>{const n=proposals.length+1;proposals.push({name:`提案${n}`,note:'新しい提案',cells:members.map(()=>({amount:0,carrier:'未設定',type:'simple'}))});render()};$('copy').onclick=()=>{const p=proposals[0];proposals.push({name:`提案${proposals.length+1}`,note:`${p.name}をコピー`,cells:p.cells.map(c=>JSON.parse(JSON.stringify(c)))});render()};init();</script></body></html>
