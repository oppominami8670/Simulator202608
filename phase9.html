<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>料金シミュレーター Phase 9</title></head><body><h1>料金シミュレーター Phase 9</h1><script>const members=[['父',8500],['母',6500],['長男',3500],['長女',1000]];const money=n=>'¥'+Math.round(Number(n)||0).toLocaleString('ja-JP');function renderMonthly(){const rows=members.map(m=>`<tr><td>${m[0]}</td><td>${money(m[1])}</td></tr>`).join('');document.body.insertAdjacentHTML('beforeend',`<table><tbody>${rows}</tbody></table>`)}renderMonthly();</script></body></html>
