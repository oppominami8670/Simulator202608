<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>料金シミュレーター Phase 3</title><style>body{font-family:Meiryo,sans-serif;margin:0;background:#f4f6f8;color:#20242a}*{box-sizing:border-box}.app{height:100vh;display:grid;grid-template-rows:58px 48px 1fr 68px;overflow:hidden}.header,.tabs,.bottom{background:#fff;border-bottom:1px solid #d9dee5}.header{padding:16px 24px;font-size:20px;font-weight:bold}.header small{font-size:12px;color:#69717d;margin-left:12px}.tabs{display:flex;padding-left:24px}.tab{border:0;background:#fff;padding:0 28px;font-weight:bold;color:#69717d;border-bottom:3px solid transparent}.tab.active{color:#087f5b;background:#eaf7f2;border-bottom-color:#087f5b}.main{padding:14px 20px;overflow:hidden}.panel{height:100%;display:none}.panel.active{display:flex;flex-direction:column}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.head h2{font-size:17px;margin:0}.hint{font-size:12px;color:#69717d}.tools{display:flex;gap:8px}.btn{border:1px solid #d9dee5;background:#fff;border-radius:6px;padding:7px 12px;font-weight:bold;cursor:pointer}.primary{background:#087f5b;color:#fff;border-color:#087f5b}.wrap{background:#fff;border:1px solid #d9dee5;border-radius:8px;overflow:auto;flex:1}.table{width:100%;border-collapse:collapse}.table th,.table td{border:1px solid #d9dee5;padding:8px;text-align:center}.table th{background:#f8fafb;font-size:12px}.cell{cursor:pointer}.cell:hover{background:#eaf7f2}.carrier{font-weight:bold;color:#087f5b}.yen{font-size:16px;font-weight:bold;margin-top:3px}.mode{font-size:10px;color:#69717d}.delta{font-weight:bold}.down{color:#087f5b}.up{color:#c43d3d}.bottom{border-top:1px solid #d9dee5;border-bottom:0;display:flex;align-items:center;padding:8px 20px}.bi{padding:0 18px;border-right:1px solid #d9dee5}.bl{font-size:11px;color:#69717d}.bv{font-size:18px;font-weight:bold}.modal-bg{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center}.modal-bg.open{display:flex}.modal{width:560px;background:#fff;border-radius:10px;padding:20px;box-shadow:0 10px 40px #0004}.modal h3{margin:0 0 15px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.modeBtn{padding:13px;border:1px solid #d9dee5;border-radius:7px;background:#fff;text-align:left;cursor:pointer}.modeBtn.selected{border:2px solid #087f5b;background:#eaf7f2}.field{margin:12px 0}.field label{display:block;font-size:12px;color:#69717d;margin-bottom:5px}.field input,.field select{width:100%;padding:9px;border:1px solid #d9dee5;border-radius:6px;font:inherit}.detailBox{display:none;background:#f8fafb;border:1px solid #d9dee5;border-radius:7px;padding:12px}.detailBox.open{display:block}.detailGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}</style></head><body><div class="app"><header class="header">料金シミュレーター <small>Phase 3 / 簡易入力＋詳細計算</small></header><nav class="tabs"><button class="tab active" data-tab="proposal">比較・提案</button><button class="tab" data-tab="monthly">月額料金</button></nav><main class="main"><section id="proposal" class="panel active"><div class="head"><div><h2>比較・提案</h2><div class="hint">各セルで「簡易入力」または「詳細計算」を選択できます。</div></div><div class="tools"><button id="add" class="btn primary">＋ 提案を追加</button><button id="copy" class="btn">コピー</button></div></div><div class="wrap"><table class="table"><thead><tr><th>提案</th><th>父<br><span class="hint">現在 ¥8,500</span></th><th>母<br><span class="hint">現在 ¥6,500</span></th><th>長男<br><span class="hint">現在 ¥3,500</span></th><th>長女<br><span class="hint">現在 ¥1,000</span></th><th>家族総額 / 増減</th></tr></thead><tbody id="body"></tbody></table></div></section><section id="monthly" class="panel"><div class="head"><h2>月額料金</h2><span class="hint">回線毎・家族総額</span></div><div class="wrap"><table class="table"><thead><tr><th>家族</th><th>現在</th><th>提案①</th><th>提案②</th><th>提案③</th></tr></thead><tbody id="monthlyBody"></tbody></table></div></section></main><footer class="bottom"><div class="bi"><div class="bl">現在</div><div class="bv">¥19,500</div></div><div id="bottom"></div><div class="bi"><div class="bl">増減（月額）</div><div id="bd" class="bv down">▲¥3,500</div></div><div class="bi"><div class="bl">増減（年額）</div><div id="bdy" class="bv down">▲¥42,000</div></div></footer></div><div id="modalBg" class="modal-bg"><div class="modal"><h3 id="title"></h3><div class="field"><label>入力方式</label><div class="modes"><button class="modeBtn selected" data-mode="simple">簡易入力<br><small>月額合計を直接入力</small></button><button class="modeBtn" data-mode="detail">詳細計算<br><small>既存計算ロジックへの接続口</small></button></div></div><div id="simpleBox"><div class="field"><label>キャリア / 提案先</label><select id="carrier"><option>docomo</option><option>au</option><option>SoftBank</option><option>楽天</option><option>UQ</option><option>Y!mobile</option><option>その他</option></select></div><div class="field"><label>月額合計</label><input id="amount" type="number" min="0" step="100"></div></div><div id="detailBox" class="detailBox"><strong>詳細計算</strong><p class="hint">既存SimulatorInstanceの計算結果をこのセルに格納するための接続口です。既存のindex.htmlは変更しません。</p><div class="detailGrid"><div><label>キャリア</label><select id="dCarrier"><option>docomo</option><option>au</option><option>SoftBank</option><option>楽天</option></select></div><div><label>計算結果（月額）</label><input id="dAmount" type="number" min="0" step="100"></div></div></div><div class="modalActions"><button id="cancel" class="btn">キャンセル</button><button id="save" class="btn primary">保存</button></div></div></div><script>const members=[['父',8500],['母',6500],['長男',3500],['長女',1000]],current=19500,money=n=>'¥'+Math.round(n).toLocaleString('ja-JP');let proposals=[{name:'提案①',note:'auへまとめる',cells:[['au',7000,'simple'],['au',5000,'simple'],['au',2000,'simple'],['au',2000,'simple']]},{name:'提案②',note:'au＋UQ',cells:[['au',7000,'simple'],['UQ',3000,'simple'],['UQ',1500,'simple'],['UQ',1000,'simple']]},{name:'提案③',note:'楽天へまとめる',cells:[['楽天',3000,'simple'],['楽天',3000,'simple'],['楽天',1000,'simple'],['楽天',1000,'simple']]}];let edit=[0,0];const total=p=>proposals[p].cells.reduce((s,c)=>s+Number(c[1]||0),0);function render(){body.innerHTML=proposals.map((p,pi)=>'<tr><td><b>'+p.name+'</b><br><span class="hint">'+p.note+'</span></td>'+p.cells.map((c,mi)=>'<td class="cell" onclick="openM('+pi+','+mi+')"><div class="carrier">'+c[0]+'</div><div class="yen">'+money(c[1])+'</div><div class="mode">'+(c[2]==='simple'?'簡易入力':'詳細計算')+'</div></td>').join('')+'<td><b>'+money(total(pi))+'</b><br><span class="delta '+(total(pi)<=current?'down':'up')+'">'+(total(pi)<=current?'▲':'▼')+money(Math.abs(total(pi)-current))+'/月</span><br><span class="hint">'+(total(pi)<=current?'▲':'▼')+money(Math.abs(total(pi)-current)*12)+'/年</span></td></tr>').join('');monthlyBody.innerHTML=members.map((m,i)=>'<tr><td><b>'+m[0]+'</b></td><td>'+money(m[1])+'</td>'+proposals.map(p=>'<td>'+money(p.cells[i][1])+'</td>').join('')+'</tr>').join('')+'<tr><td><b>家族総額</b></td><td><b>'+money(current)+'</b></td>'+proposals.map((p,i)=>'<td><b>'+money(total(i))+'</b><br><span class="delta '+(total(i)<=current?'down':'up')+'">'+(total(i)<=current?'▲':'▼')+money(Math.abs(total(i)-current))+'</span></td>').join('')+'</tr>';bottom.innerHTML=proposals.map((p,i)=>'<div class="bi"><div class="bl">'+p.name+'</div><div class="bv">'+money(total(i))+'</div></div>').join('');let d=total(0)-current;bd.textContent=(d<=0?'▲':'▼')+money(Math.abs(d));bdy.textContent=(d<=0?'▲':'▼')+money(Math.abs(d)*12)}function openM(p,m){edit=[p,m];let c=proposals[p].cells[m];title.textContent=proposals[p].name+' / '+members[m][0];carrier.value=c[0];amount.value=c[1];dCarrier.value=c[0];dAmount.value=c[1];document.querySelectorAll('.modeBtn').forEach(b=>b.classList.toggle('selected',b.dataset.mode===c[2]));setMode(c[2]);modalBg.classList.add('open')}function setMode(mode){simpleBox.style.display=mode==='simple'?'block':'none';detailBox.classList.toggle('open',mode==='detail');document.querySelectorAll('.modeBtn').forEach(b=>b.classList.toggle('selected',b.dataset.mode===mode))}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});document.querySelectorAll('.modeBtn').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));cancel.onclick=()=>modalBg.classList.remove('open');save.onclick=()=>{let mode=document.querySelector('.modeBtn.selected').dataset.mode;let c=mode==='simple'?[carrier.value,Number(amount.value)||0,'simple']:[dCarrier.value,Number(dAmount.value)||0,'detail'];proposals[edit[0]].cells[edit[1]]=c;modalBg.classList.remove('open');render()};add.onclick=()=>{let n=proposals.length+1;proposals.push({name:'提案'+n,note:'新しい提案',cells:members.map(()=>['未設定',0,'simple'])});render()};copy.onclick=()=>{let p=proposals[0];proposals.push({name:'提案'+(proposals.length+1),note:p.name+'をコピー',cells:p.cells.map(c=>[...c])});render()};render();</script></body></html>
