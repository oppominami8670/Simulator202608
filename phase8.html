<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>料金シミュレーター Phase 8</title><style>html,body{height:100%;margin:0;overflow:hidden}body{font-family:Meiryo,sans-serif;background:#f4f6f8;color:#20242a}*{box-sizing:border-box}.app{height:100vh;display:grid;grid-template-rows:58px 48px minmax(0,1fr) 68px}.header,.tabs,.bottom{background:#fff;border-bottom:1px solid #d9dee5}.header{display:flex;align-items:center;padding:0 24px;font-size:20px;font-weight:700}.header small{margin-left:12px;font-size:12px;color:#69717d;font-weight:400}.tabs{display:flex;padding-left:24px}.tab{height:48px;padding:0 28px;border:0;background:#fff;color:#69717d;font-weight:700;border-bottom:3px solid transparent;cursor:pointer}.tab.active{color:#087f5b;background:#eaf7f2;border-bottom-color:#087f5b}.main{min-height:0;padding:14px 20px 10px;overflow:hidden}.panel{height:100%;display:none}.panel.active{display:flex;flex-direction:column;min-height:0}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.head h2{margin:0;font-size:17px}.hint{font-size:12px;color:#69717d}.tools{display:flex;gap:8px}.btn{border:1px solid #d9dee5;background:#fff;border-radius:6px;padding:7px 12px;font-weight:700;cursor:pointer}.primary{background:#087f5b;color:#fff;border-color:#087f5b}.wrap{flex:1;min-height:0;overflow:auto;background:#fff;border:1px solid #d9dee5;border-radius:8px}.table{width:100%;border-collapse:collapse}.table th,.table td{border:1px solid #d9dee5;padding:7px;text-align:center;vertical-align:middle}.table th{background:#f8fafb;font-size:12px}.cell{cursor:pointer}.cell:hover{background:#eaf7f2}.carrier{font-weight:700;color:#087f5b}.sub{font-size:11px;color:#69717d}.yen{font-size:16px;font-weight:700}.down{color:#087f5b}.up{color:#c43d3d}.bottom{border-top:1px solid #d9dee5;border-bottom:0;display:flex;align-items:center;padding:8px 20px;overflow:hidden}.bi{padding:0 18px;border-right:1px solid #d9dee5;white-space:nowrap}.bi:first-child{padding-left:0}.bl{font-size:11px;color:#69717d}.bv{font-size:18px;font-weight:700}.modal-bg{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:10}.modal-bg.open{display:flex}.modal{width:min(94vw,920px);max-height:92vh;overflow:auto;background:#fff;border-radius:10px;padding:18px}.modal h3{margin:0 0 12px}.modebar{display:flex;gap:8px;margin-bottom:12px}.modebtn{flex:1;padding:10px;border:1px solid #d9dee5;background:#fff;border-radius:7px;font-weight:700;cursor:pointer}.modebtn.active{border:2px solid #087f5b;background:#eaf7f2}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.field label{display:block;font-size:11px;color:#69717d;margin-bottom:4px}.field select,.field input{width:100%;padding:8px;border:1px solid #d9dee5;border-radius:6px;font:inherit}.box{background:#f8fafb;border:1px solid #d9dee5;border-radius:8px;padding:10px;margin-bottom:10px}.opts{display:flex;flex-wrap:wrap;gap:6px}.opt{padding:6px 9px;border:1px solid #d9dee5;background:#fff;border-radius:6px;font-size:11px;cursor:pointer}.opt.active{border-color:#087f5b;background:#eaf7f2}.summary{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#eaf7f2;border-radius:7px}.summary strong{font-size:21px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}</style></head><body><div class="app"><header class="header">料金シミュレーター <small>Phase 8 / 既存Simulator計算エンジン再利用版</small></header><nav class="tabs"><button class="tab active" data-tab="proposal">比較・提案</button><button class="tab" data-tab="monthly">月額料金</button></nav><main class="main"><section id="proposal" class="panel active"><div class="head"><div><h2>比較・提案</h2><div class="hint">既存Simulator202603と同じ料金マスタ・計算式を提案パターンから利用します。</div></div><div class="tools"><button id="add" class="btn primary">＋ 提案を追加</button><button id="copy" class="btn">コピー</button></div></div><div class="wrap"><table class="table"><thead><tr><th>提案</th><th>父<br><span class="sub">現在 ¥8,500</span></th><th>母<br><span class="sub">現在 ¥6,500</span></th><th>長男<br><span class="sub">現在 ¥3,500</span></th><th>長女<br><span class="sub">現在 ¥1,000</span></th><th>家族総額 / 増減</th></tr></thead><tbody id="proposalBody"></tbody></table></div></section><section id="monthly" class="panel"><div class="head"><h2>月額料金</h2><span class="hint">回線毎・家族総額 / 1-24ヶ月と25ヶ月以降を確認</span></div><div class="wrap"><table class="table"><thead><tr><th>家族</th><th>現在</th><th>提案①</th><th>提案②</th><th>提案③</th></tr></thead><tbody id="monthlyBody"></tbody></table></div></section></main><footer class="bottom"><div class="bi"><div class="bl">現在</div><div class="bv">¥19,500</div></div><div id="bottom"></div><div class="bi"><div class="bl">増減（月額）</div><div id="bd" class="bv"></div></div><div class="bi"><div class="bl">増減（年額）</div><div id="bdy" class="bv"></div></div></footer></div><div id="modalBg" class="modal-bg"><div class="modal"><h3 id="modalTitle"></h3><div class="modebar"><button class="modebtn active" data-mode="simple">簡易入力：月額合計を直接入力</button><button class="modebtn" data-mode="engine">既存計算エンジン：キャリア・プラン・機種を選択</button></div><div id="simpleArea" class="box"><div class="grid4"><div class="field"><label>キャリア</label><select id="simpleCarrier"><option>docomo</option><option>au</option><option>SoftBank</option><option>楽天</option><option>UQ</option><option>Y!mobile</option><option>その他</option></select></div><div class="field"><label>月額合計</label><input id="simpleAmount" type="number" min="0" step="100"></div></div></div><div id="engineArea" class="box" style="display:none"><div class="grid4"><div class="field"><label>キャリア</label><select id="carrier"></select></div><div class="field"><label>機種カテゴリ</label><select id="category"><option value="iPhone">iPhone</option><option value="Android">Android</option><option value="SIMのみ">SIMのみ</option></select></div><div class="field"><label>機種</label><select id="device"></select></div><div class="field"><label>端末支払回数</label><select id="ins"></select></div><div class="field"><label>契約区分</label><select id="con"></select></div><div class="field"><label>端末値引き総額</label><input id="devDisc" type="number" min="0" value="0"></div><div class="field"><label>料金プラン</label><select id="plan"></select></div><div class="field"><label>データ容量</label><select id="data"></select></div></div><div class="box"><div class="field"><label>適用割引（最大5つ）</label><div id="discounts" class="opts"></div></div></div><div class="box"><div class="field"><label>端末保証・オプション</label><div id="options" class="opts"></div></div></div><div class="box"><div class="grid4"><div class="field"><label>固定回線</label><select id="net"></select></div><div class="field"><label>固定回線区分</label><select id="netType"></select></div></div><div class="field"><label>固定回線オプション</label><div id="netOpts" class="opts"></div></div></div><div class="summary"><span>既存エンジン計算結果</span><strong id="engineTotal">¥0</strong></div><div class="sub" id="periodInfo"></div></div><div class="actions"><button id="cancel" class="btn">キャンセル</button><button id="save" class="btn primary">保存</button></div></div></div><script>const GAS_URL="https://script.google.com/macros/s/AKfycbxUj8Ojmgq2H-weGZRui_rdi9W6_y6QSUjbjKY1Lr89IsErmVNqxYZx_walEIs3QoaA/exec";const EXCLUSIVE_GROUPS={UQ:[["自宅セット","家族セット"]],"Y!mobile":[["家族割引","おうち割 光セット","おうち割 でんきセット"],["PayPayカード割 ゴールド","PayPayカード割"]],softbank:[]};let GLOBAL_DATA=null,edit=[0,0],mode="simple";const members=[["父",8500],["母",6500],["長男",3500],["長女",1000]],current=19500,money=n=>"¥"+Math.round(Number(n)||0).toLocaleString("ja-JP");let proposals=[{name:"提案①",note:"auへまとめる",cells:members.map(()=>({amount:0,carrier:"au",type:"simple"}))},{name:"提案②",note:"au＋UQ",cells:members.map(()=>({amount:0,carrier:"UQ",type:"simple"}))},{name:"提案③",note:"楽天へまとめる",cells:members.map(()=>({amount:0,carrier:"楽天",type:"simple"}))}];let engineState={carrier:"",category:"iPhone",device:"",ins:24,con:"",devDisc:0,plan:"",data:0,discounts:[],options:[],net:"",netType:"",netOpts:[]};function total(p){return p.cells.reduce((s,c)=>s+Number(c.amount||0),0)}async function init(){try{const r=await fetch(GAS_URL,{redirect:"follow"});GLOBAL_DATA=await r.json();populateCarriers();render()}catch(e){console.error(e);alert("料金マスタの取得に失敗しました。GAS URLと公開設定を確認してください。");render()}}function populateCarriers(){carrier.innerHTML='<option value="">キャリア選択</option>'+Object.keys(GLOBAL_DATA||{}).map(c=>`<option>${c}</option>`).join("")}function val(id){return document.getElementById(id).value}function setOptions(el,arr,placeholder){el.innerHTML=placeholder?`<option value="">${placeholder}</option>`:"";arr.forEach(x=>el.appendChild(new Option(x[0]??x,x[0]??x)))}function loadCarrier(){const c=val("carrier");if(!c||!GLOBAL_DATA?.[c])return;engineState.carrier=c;setOptions(plan,[...new Set(GLOBAL_DATA[c].plans.map(x=>x[0]))],"プラン選択");setOptions(net,[...new Set(GLOBAL_DATA[c].internets.map(x=>x[0]))],"固定回線なし");loadDevices();loadDiscounts();loadNetOpts()}function loadDevices(){const c=val("carrier"),cat=val("category"),rows=(GLOBAL_DATA?.[c]?.devices||[]).filter(x=>x[0]===cat);setOptions(device,[...new Set(rows.map(x=>x[1]))],"機種選択");loadIns()}function loadIns(){const c=val("carrier"),d=(GLOBAL_DATA?.[c]?.devices||[]).filter(x=>x[1]===val("device"));setOptions(ins,[...new Set(d.map(x=>x[2]))].map(x=>[x,x+"回"]),"");loadCon()}function loadCon(){const c=val("carrier"),d=(GLOBAL_DATA?.[c]?.devices||[]).filter(x=>x[1]===val("device")&&x[2]==val("ins"));const lm={mnp:"MNP",new:"新規",standalone:"機種変更"};con.innerHTML='<option value="">区分</option>';d.forEach(x=>con.appendChild(new Option(lm[x[3]]||x[3],x[3])));loadOptions();calcEngine()}function loadPlan(){const c=val("carrier"),rows=(GLOBAL_DATA?.[c]?.plans||[]).filter(x=>x[0]===val("plan"));data.innerHTML='<option value="0">データ量</option>';rows.forEach(x=>data.appendChild(new Option(`${x[1]} (${x[2]}円)`,x[2])));loadDiscounts();calcEngine()}function loadDiscounts(){if(!GLOBAL_DATA)return;const c=val("carrier"),list=(GLOBAL_DATA?.[c]?.discounts||[]),chosen=new Set(engineState.discounts);discounts.innerHTML="";list.forEach(d=>{const n=d[0],p=parseInt(d[2])||0;if(c==="Rakuten"){const allowed=["最強家族割","最強こども割","最強青春割","最強シニアプログラム"];if(!allowed.some(a=>n.includes(a)))return}const b=document.createElement("button");b.type="button";b.className="opt"+(chosen.has(n)?" active":"");b.textContent=`${n} (${p}円)`;b.onclick=()=>{b.classList.toggle("active");engineState.discounts=[...discounts.querySelectorAll(".active")].map(x=>x.textContent.split(" (")[0]);calcEngine()};discounts.appendChild(b)})}function loadOptions(){const c=val("carrier"),rows=GLOBAL_DATA?.[c]?.devices||[],r=rows.find(x=>x[1]===val("device")&&x[2]==val("ins")&&x[3]===val("con"));options.innerHTML="";if(r&&r[6])addOpt(`端末補償 (+${r[6]})`,r[6],"HOSHO");(GLOBAL_DATA?.[c]?.options||[]).forEach(o=>addOpt(`${o[0]} (+${o[1]})`,o[1],o[0]));calcEngine()}function addOpt(label,price,key){const b=document.createElement("button");b.type="button";b.className="opt"+(engineState.options.includes(key)?" active":"");b.textContent=label;b.onclick=()=>{b.classList.toggle("active");engineState.options=[...options.querySelectorAll(".active")].map(x=>x.textContent.split(" (")[0]);calcEngine()};options.appendChild(b)}function loadNetTypes(){const c=val("carrier"),rows=(GLOBAL_DATA?.[c]?.internets||[]).filter(x=>x[0]===val("net")&&x[1]!=="");netType.innerHTML='<option value="">区分</option>';rows.forEach((x,i)=>netType.appendChild(new Option(`${x[1]} (${x[2]}円)`,i)));calcEngine();loadNetOpts()}function loadNetOpts(){const c=val("carrier"),rows=GLOBAL_DATA?.[c]?.internets||[];netOpts.innerHTML="";const names=[...new Set(rows.filter(x=>x[0]===val("net")).map(x=>x[4]).filter(Boolean))];names.forEach(n=>{const row=rows.find(x=>x[0]===val("net")&&x[4]===n);if(!row)return;addNetOpt(n,parseInt(row[5])||0)})}function addNetOpt(n,p){const b=document.createElement("button");b.className="opt"+(engineState.netOpts.includes(n)?" active":"");b.textContent=`${n} (${p}円)`;b.onclick=()=>{b.classList.toggle("active");engineState.netOpts=[...netOpts.querySelectorAll(".active")].map(x=>x.textContent.split(" (")[0]);calcEngine()};netOpts.appendChild(b)}function calcEngine(){const c=val("carrier"),pName=val("plan"),insValue=parseInt(val("ins"))||24,planP=parseInt(val("data"))||0,dataLabel=data.options[data.selectedIndex]?.text||"",devDInput=parseInt(val("devDisc"))||0,devD=Math.floor(devDInput/24),threshold=insValue===36?36:24;let d1=0,d2=0;const r=(GLOBAL_DATA?.[c]?.devices||[]).find(x=>x[1]===val("device")&&x[2]==insValue&&x[3]===val("con"));if(r){d1=Math.max(0,(parseInt(r[4])||0)-devD);d2=parseInt(r[5])||0}let optT=0;engineState.options.forEach(k=>{const btn=[...options.querySelectorAll(".active")].find(x=>x.textContent.startsWith(k));if(btn)optT+=parseInt((btn.textContent.match(/\(([0-9]+)円\)/)||[])[1]||0)});let netT=0;engineState.netOpts.forEach(k=>{const btn=[...netOpts.querySelectorAll(".active")].find(x=>x.textContent.startsWith(k));if(btn)netT+=parseInt((btn.textContent.match(/\(([0-9]+)円\)/)||[])[1]||0)});let baseDisc1=0,baseDisc2=0;const selectedDiscNames=engineState.discounts;selectedDiscNames.forEach(name=>{const d=(GLOBAL_DATA?.[c]?.discounts||[]).find(x=>x[0]===name);if(!d)return;let price=parseInt(d[2])||0;if(c==="au"){if(pName.includes("最強U-NEXTプラン"))price=-110;else if(pName.includes("最強プラン"))price=dataLabel.includes("~3GB")?-440:-110}const limited=["1年おトク割+","デビュー特典","応援割","親子割"].some(x=>name.includes(x));baseDisc1+=price;if(!limited)baseDisc2+=price});let bonusTotal=0,showS=false;if(c==="Rakuten"){const isSenior=selectedDiscNames.some(x=>x.includes("シニア"));const optK=engineState.options;if(isSenior&&optK.some(x=>/通話/.test(x))&&optK.some(x=>/操作サポート/.test(x))&&optK.some(x=>/Whoscall/.test(x))){bonusTotal-=880;showS=true}}const finalDisc1=baseDisc1+bonusTotal,finalDisc2=baseDisc2+(showS?-880:0);const rows=(GLOBAL_DATA?.[c]?.internets||[]).filter(x=>x[0]===val("net")&&x[1]!=="");const nr=rows[val("netType")];const netMain=nr?[parseInt(nr[2])||0,parseInt(nr[2])||0]:[0,0];if(nr)netMain[0]+=(parseInt(nr[3])||0);const t1=Math.max(0,planP+d1+optT+netMain[0]+netT+finalDisc1),t2=Math.max(0,planP+d2+optT+netMain[1]+netT+finalDisc2);engineState={...engineState,carrier:c,category:val("category"),device:val("device"),ins:insValue,con:val("con"),devDisc:devDInput,plan:pName,data:planP};engineTotal.textContent=money(t1);periodInfo.textContent=`1-${threshold}ヶ月: ${money(t1)} / ${threshold+1}ヶ月目以降: ${money(t2)}`;return{first:t1,later:t2,state:JSON.parse(JSON.stringify(engineState))}}function openModal(pi,mi){edit=[pi,mi];const c=proposals[pi].cells[mi];modalTitle.textContent=`${proposals[pi].name} / ${members[mi][0]}`;setMode(c.type||"simple");if(c.type==="engine"&&c.state)restoreEngine(c.state);else{simpleCarrier.value=c.carrier||"docomo";simpleAmount.value=c.amount||0}modalBg.classList.add("open")}function restoreEngine(s){carrier.value=s.carrier||"";category.value=s.category||"iPhone";loadCarrier();device.value=s.device||"";loadIns();ins.value=s.ins||24;loadCon();con.value=s.con||"";plan.value=s.plan||"";loadPlan();data.value=s.data||0;devDisc.value=s.devDisc||0;engineState={...engineState,...s};loadOptions();loadDiscounts();loadNetTypes();net.value=s.net||"";netType.value=s.netType||"";calcEngine()}function setMode(m){mode=m;document.querySelectorAll(".modebtn").forEach(b=>b.classList.toggle("active",b.dataset.mode===m));simpleArea.style.display=m==="simple"?"block":"none";engineArea.style.display=m==="engine"?"block":"none"}document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById(b.dataset.tab).classList.add("active")});document.querySelectorAll(".modebtn").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));carrier.onchange=loadCarrier;category.onchange=loadDevices;device.onchange=loadIns;ins.onchange=loadCon;con.onchange=loadOptions;plan.onchange=loadPlan;data.onchange=calcEngine;devDisc.oninput=calcEngine;net.onchange=()=>{loadNetTypes();loadNetOpts()};netType.onchange=calcEngine;cancel.onclick=()=>modalBg.classList.remove("open");save.onclick=()=>{if(mode==="simple"){proposals[edit[0]].cells[edit[1]]={amount:Number(simpleAmount.value)||0,carrier:simpleCarrier.value,type:"simple"}}else{const r=calcEngine();proposals[edit[0]].cells[edit[1]]={amount:r.first,carrier:r.state.carrier,type:"engine",state:r.state,later:r.later}}modalBg.classList.remove("open");render()};add.onclick=()=>{const n=proposals.length+1;proposals.push({name:`提案${n}`,note:"新しい提案",cells:members.map(()=>({amount:0,carrier:"未設定",type:"simple"}))});render()};copy.onclick=()=>{const p=proposals[0];proposals.push({name:`提案${proposals.length+1}`,note:`${p.name}をコピー`,cells:p.cells.map(c=>JSON.parse(JSON.stringify(c)))});render()};function render(){proposalBody.innerHTML=proposals.map((p,pi)=>`<tr><td><b>${p.name}</b><br><span class="sub">${p.note}</span></td>`+p.cells.map((c,mi)=>`<td class="cell" onclick="openModal(${pi},${mi})"><div class="carrier">${c.carrier||"未設定"}</div>${c.state?.plan?`<div class="sub">${c.state.plan}${c.state.device?` / ${c.state.device}`:""}</div>`:""}<div class="yen">${money(c.amount)}</div><div class="sub">${c.type==="engine"?"既存エンジン":"簡易入力"}</div></td>`).join("")+`<td><b>${money(total(p))}</b><br><span class="${total(p)<=current?"down":"up"}">${total(p)<=current?"▲":"▼"}${money(Math.abs(total(p)-current))}/月</span><br><span class="sub">${total(p)<=current?"▲":"▼"}${money(Math.abs(total(p)-current)*12)}/年</span></td></tr>`).join("");monthlyBody.innerHTML=members.map((m,i)=>`<tr><td><b>${m[0]}</b></td><td>${money(m[1])}</td>`+proposals.map(p=>`<td>${money(p.cells[i].amount)}</td>`).join("")+`</tr>`).join("")+`<tr><td><b>家族総額</b></td><td><b>${money(current)}</b></td>`+proposals.map(p=>`<td><b>${money(total(p))}</b></td>`).join("")+`</tr>`;bottom.innerHTML=proposals.map(p=>`<div class="bi"><div class="bl">${p.name}</div><div class="bv">${money(total(p))}</div></div>`).join("");const d=total(proposals[0])-current;bd.textContent=(d<=0?"▲":"▼")+money(Math.abs(d));bdy.textContent=(d<=0?"▲":"▼")+money(Math.abs(d)*12)}init();</script></body></html>
