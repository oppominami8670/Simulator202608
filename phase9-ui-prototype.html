<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>料金シミュレーター Phase 9 UI Prototype</title>
<style>
:root{--green:#087f5b;--green-bg:#eaf7f2;--border:#d9dee5;--bg:#f4f6f8;--muted:#69717d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Meiryo,sans-serif;background:var(--bg);color:#20242a}.header{height:58px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;font-size:20px;font-weight:700}.header small{margin-left:12px;font-size:12px;color:var(--muted);font-weight:400}.tabs{height:48px;background:#fff;border-bottom:1px solid var(--border);display:flex;padding-left:24px}.tab{height:48px;padding:0 30px;border:0;background:#fff;color:var(--muted);font-weight:700;cursor:pointer;border-bottom:3px solid transparent}.tab.active{color:var(--green);background:var(--green-bg);border-bottom-color:var(--green)}.main{padding:16px 20px}.panel{display:none}.panel.active{display:block}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.head h2{margin:0;font-size:17px}.tools{display:flex;gap:8px}.btn{border:1px solid var(--border);background:#fff;border-radius:6px;padding:8px 14px;font-weight:700;cursor:pointer}.primary{background:var(--green);color:#fff;border-color:var(--green)}.wrap{overflow:auto;background:#fff;border:1px solid var(--border);border-radius:8px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{border:1px solid var(--border);padding:9px;text-align:center;vertical-align:middle}.table th{background:#f8fafb;font-size:12px}.label{text-align:left!important;font-weight:700;background:#f8fafb;white-space:nowrap}.sub{font-size:11px;color:var(--muted)}.select,.text-input{width:100%;padding:7px;border:1px solid var(--border);border-radius:6px;background:#fff}.money{font-weight:700}.empty{color:#a0a7b0;font-size:12px}.delta{font-size:16px;font-weight:800;white-space:nowrap}.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.note-box{background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden}.note-title{background:#f8fafb;border-bottom:1px solid var(--border);padding:10px 12px;font-weight:700}.note-body{padding:12px;min-height:145px}.note-body textarea{width:100%;height:120px;resize:vertical;border:1px solid var(--border);border-radius:6px;padding:9px;font:inherit}.benefit-list{margin:0;padding-left:20px;line-height:1.9}@media(max-width:700px){.compare-grid{grid-template-columns:1fr}.tabs{padding-left:0}.tab{flex:1;padding:0 8px}.main{padding:12px}.header{padding:0 14px}.header small{display:none}}
</style>
</head>
<body>
<header class="header">料金シミュレーター <small>Phase 9 / UI Prototype</small></header>
<nav class="tabs"><button class="tab active" data-tab="current">現在</button><button class="tab" data-tab="proposal">提案</button><button class="tab" data-tab="compare">比較</button></nav>
<main class="main">
<section id="current" class="panel active"><div class="head"><div><h2>現在の契約状況</h2><div class="sub">契約回線をA・B・C…として管理。家族構成は仮定しません。</div></div><button class="btn primary" id="addLine">＋ 回線を増やす</button></div><div class="wrap"><table class="table"><thead><tr id="currentHead"></tr></thead><tbody id="currentBody"></tbody></table></div></section>
<section id="proposal" class="panel"><div class="head"><div><h2>提案</h2><div class="sub">現在の契約回線数と連動します。</div></div><div class="tools"><button class="btn primary" id="addProposal">＋ 提案を追加</button><button class="btn" id="copyProposal">提案をコピー</button></div></div><div class="wrap"><table class="table"><thead><tr id="proposalHead"></tr></thead><tbody id="proposalBody"></tbody></table></div></section>
<section id="compare" class="panel"><div class="head"><div><h2>比較</h2><div class="sub">提案数と契約回線数に連動して表示します。</div></div></div><div class="wrap"><table class="table"><thead><tr id="compareHead"></tr></thead><tbody id="compareBody"></tbody></table></div><div class="compare-grid"><div class="note-box"><div class="note-title">乗り換え後のメリット</div><div class="note-body"><ul class="benefit-list"><li>月額料金の差額を表示</li><li>年間削減額を表示</li><li>適用される主な割引・セットを表示</li></ul></div></div><div class="note-box"><div class="note-title">MEMO</div><div class="note-body"><textarea placeholder="商談メモを入力"></textarea></div></div></div></section>
</main>
<script>
let lines=['A'];
let proposalCount=1;
const rows=[['キャリア','選択してください'],['プラン','選択してください'],['端末',''],['残債','¥0'],['支払残数','0回'],['月額','¥0']];
function lineHeaders(){return lines.map(x=>`<th>${x}</th>`).join('')}
function currentCell(label){if(label==='端末')return '<input class="text-input" type="text" placeholder="端末名を入力">';if(['月額','残債','支払残数'].includes(label))return '<input class="select" type="number" min="0" value="0">';return '<select class="select"><option>選択してください</option></select>'}
function renderCurrent(){document.getElementById('currentHead').innerHTML='<th class="label">項目</th>'+lineHeaders()+'<th>固定回線</th>';document.getElementById('currentBody').innerHTML=rows.map(([label])=>`<tr><td class="label">${label}</td>${lines.map(()=>`<td>${currentCell(label)}</td>`).join('')}<td>${label==='端末'?'<input class="text-input" type="text" placeholder="固定回線名を入力">':currentCell(label)}</td></tr>`).join('');renderProposal();renderCompare()}
function renderProposal(){document.getElementById('proposalHead').innerHTML='<th>提案</th>'+lineHeaders()+'<th>固定回線</th><th>合計</th>';document.getElementById('proposalBody').innerHTML=Array.from({length:proposalCount},(_,i)=>`<tr><td class="label">プラン${['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'][i]||i+1}</td>${lines.map(()=>'<td class="empty">現在Phase9の入力UIを接続</td>').join('')}<td class="empty">現在Phase9の入力UIを接続</td><td class="money">¥0</td></tr>`).join('')}
function renderCompare(){const pcols=Array.from({length:proposalCount},(_,i)=>`<th>提案${['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'][i]||i+1}</th>`).join('');document.getElementById('compareHead').innerHTML='<th>項目</th><th>現在</th>'+pcols;const lineRows=lines.map(line=>`<tr><td class="label">${line}</td><td>¥0</td>${Array.from({length:proposalCount},()=>'<td>¥0</td>').join('')}</tr>`).join('');const fixed=`<tr><td class="label">固定回線</td><td>¥0</td>${Array.from({length:proposalCount},()=>'<td>¥0</td>').join('')}</tr>`;const totals=`<tr><td class="label">合計</td><td class="money">¥0</td>${Array.from({length:proposalCount},()=>'<td class="money">¥0</td>').join('')}</tr>`;const deltas=`<tr><td class="label">総額／増減</td><td class="delta">—</td>${Array.from({length:proposalCount},()=>'<td class="delta">▲¥0/月<br>▲¥0/年</td>').join('')}</tr>`;document.getElementById('compareBody').innerHTML=lineRows+fixed+totals+deltas}
document.getElementById('addLine').onclick=()=>{lines.push(String.fromCharCode(65+lines.length));renderCurrent()};document.getElementById('addProposal').onclick=()=>{proposalCount++;renderProposal();renderCompare()};document.getElementById('copyProposal').onclick=()=>{proposalCount++;renderProposal();renderCompare()};document.querySelectorAll('.tab').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.getElementById(btn.dataset.tab).classList.add('active')});renderCurrent();
</script>
</body>
</html>
