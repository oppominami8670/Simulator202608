<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>料金シミュレーター Phase 9</title>
<style>
:root{--g:#087f5b;--gb:#eaf7f2;--b:#d9dee5;--bg:#f4f6f8;--m:#69717d;--r:#d64545}
*{box-sizing:border-box}body{margin:0;font-family:Meiryo,sans-serif;background:var(--bg);color:#20242a}.header{height:58px;background:#fff;border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 24px;font-size:20px;font-weight:700}.tabs{height:48px;background:#fff;border-bottom:1px solid var(--b);display:flex;padding-left:24px}.tab{height:48px;padding:0 30px;border:0;background:#fff;color:var(--m);font-weight:700;cursor:pointer;border-bottom:3px solid transparent}.tab.active{color:var(--g);background:var(--gb);border-bottom-color:var(--g)}.main{padding:16px 20px}.panel{display:none}.panel.active{display:block}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.head h2{margin:0;font-size:17px}.tools{display:flex;gap:8px}.btn{border:1px solid var(--b);background:#fff;border-radius:6px;padding:8px 14px;font-weight:700;cursor:pointer}.primary{background:var(--g);color:#fff;border-color:var(--g)}.wrap{overflow:auto;background:#fff;border:1px solid var(--b);border-radius:8px}.table{width:100%;border-collapse:collapse;min-width:1000px}.table th,.table td{border:1px solid var(--b);padding:8px;text-align:center;vertical-align:middle}.table th{background:#f8fafb;font-size:12px}.label{text-align:left!important;font-weight:700;background:#f8fafb;white-space:nowrap}.sub{font-size:11px;color:var(--m)}.input,.select{width:100%;padding:7px;border:1px solid var(--b);border-radius:6px;background:#fff}.money{font-weight:700}.delta{font-size:16px;font-weight:800;white-space:nowrap}.status{position:fixed;right:14px;bottom:14px;background:#fff;border:1px solid var(--b);border-radius:8px;padding:8px 12px;font-size:12px;z-index:20}.status.error{color:var(--r)}.options{display:flex;flex-wrap:wrap;gap:6px;text-align:left}.options label{display:inline-flex;align-items:center;gap:3px;font-size:12px;background:#fff9db;padding:4px 6px;border-radius:5px}.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.note{background:#fff;border:1px solid var(--b);border-radius:8px}.note h3{margin:0;padding:10px 12px;background:#f8fafb;border-bottom:1px solid var(--b);font-size:14px}.note textarea{margin:12px;width:calc(100% - 24px);height:120px}@media(max-width:700px){.tab{flex:1;padding:0 8px}.tabs{padding-left:0}.main{padding:12px}.compare-grid{grid-template-columns:1fr}.header{padding:0 14px}}
</style>
</head>
<body>
<header class="header">料金シミュレーター <small style="margin-left:12px;font-size:12px;color:#69717d">Phase 9</small></header>
<nav class="tabs"><button class="tab active" data-tab="current">現在</button><button class="tab" data-tab="proposal">提案</button><button class="tab" data-tab="compare">比較</button></nav>
<main class="main">
<section id="current" class="panel active">
<div class="head"><div><h2>現在の契約状況</h2><div class="sub">契約回線をA・B・C…として管理。家族構成は仮定しません。</div></div><button class="btn primary" id="addLine">＋ 回線を増やす</button></div>
<div class="wrap"><table class="table"><thead><tr id="currentHead"></tr></thead><tbody id="currentBody"></tbody></table></div>
</section>
<section id="proposal" class="panel">
<div class="head"><div><h2>提案</h2><div class="sub">キャリア → プラン → データ量 → 区分 → 端末種別 → 端末 → 分割 → オプション</div></div><div class="tools"><button class="btn primary" id="addProposal">＋ 提案を追加</button><button class="btn" id="copyProposal">提案をコピー</button></div></div>
<div id="proposalArea"></div>
</section>
<section id="compare" class="panel">
<div class="head"><h2>比較</h2></div>
<div class="wrap"><table class="table"><thead><tr id="compareHead"></tr></thead><tbody id="compareBody"></tbody></table></div>
<div class="compare-grid"><div class="note"><h3>乗り換え後のメリット</h3><ul><li>月額料金の差額を表示</li><li>年間削減額を表示</li><li>適用される主な割引・セットを表示</li></ul></div><div class="note"><h3>MEMO</h3><textarea placeholder="商談メモを入力"></textarea></div></div>
</section>
</main>
<div id="status" class="status">GASデータ読込中…</div>
<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbxUj8Ojmgq2H-weGZRui_rdi9W6_y6QSUjbjKY1Lr89IsErmVNqxYZx_walEIs3QoaA/exec';
const EXCLUSIVE_GROUPS={'UQ':[['自宅セット','家族セット']],'Y!mobile':[['家族割引','おうち割 光セット','おうち割 でんきセット'],['PayPayカード割 ゴールド','PayPayカード割']],'softbank':[]};
const DEVICE_TYPES=['Android','iPhone','SIMのみ'];
const DIVISION_LABELS={'mnp':'MNP','new':'新規','standalone':'端末のみ','機種変更':'端末のみ','端末のみ':'端末のみ','MNP':'MNP','新規':'新規'};
let GLOBAL_DATA=null,lines=['A'];
const circled=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
const currentState=[newCurrent()];const fixedState=newFixed();let proposals=[makeProposal()];
function newCurrent(){return{carrier:'',plan:'',device:'',balance:0,remaining:0,monthly:0}}
function newFixed(){return{carrier:'',plan:'',type:'',device:'',balance:0,remaining:0,monthly:0}}
function newLine(){return{carrier:'',plan:'',data:'',division:'',deviceType:'',device:'',installment:'',options:[],monthly:0}}
function makeProposal(){return{lines:lines.map(newLine),fixed:newFixed()}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uniq(a){return[...new Set((a||[]).filter(v=>v!==undefined&&v!==null&&v!==''))]}
function num(v){const n=parseInt(String(v??0).replace(/[^0-9-]/g,''),10);return Number.isFinite(n)?n:0}
function carriers(){return GLOBAL_DATA?Object.keys(GLOBAL_DATA):[]}
function plans(c){return uniq((GLOBAL_DATA?.[c]?.plans||[]).map(r=>r[0]))}
function planRows(c,p){return(GLOBAL_DATA?.[c]?.plans||[]).filter(r=>r[0]===p)}
function deviceRows(c){return GLOBAL_DATA?.[c]?.devices||[]}
function deviceTypeMatch(r,t){return !t||r[0]===t||r[6]===t}
function divisions(c,t){return uniq(deviceRows(c).filter(r=>deviceTypeMatch(r,t)).map(r=>r[3]))}
function devices(c,t,dv){return uniq(deviceRows(c).filter(r=>deviceTypeMatch(r,t)&&r[3]===dv).map(r=>r[1]))}
function installments(c,t,d){return uniq(deviceRows(c).filter(r=>deviceTypeMatch(r,t)&&r[1]===d).map(r=>r[2]))}
function internet(c){return uniq((GLOBAL_DATA?.[c]?.internets||[]).map(r=>r[0]))}
function internetRows(c,n){return(GLOBAL_DATA?.[c]?.internets||[]).filter(r=>r[0]===n&&r[1]!==undefined&&r[1]!=='')}
function options(c){return uniq((GLOBAL_DATA?.[c]?.options||[]).map(r=>r[0]))}
function optionPrice(c,n){const r=(GLOBAL_DATA?.[c]?.options||[]).find(x=>x[0]===n);return r?num(r[1]):0}
function select(list,value,cls='',disabled=false,labels={}){return`<select class="select ${cls}" ${disabled?'disabled':''}><option value="">選択してください</option>${list.map(x=>`<option value="${esc(x)}" ${String(x)===String(value)?'selected':''}>${esc(labels[x]??x)}</option>`).join('')}</select>`}
function currentInput(i,label){const s=currentState[i];if(label==='キャリア')return`<td>${select(carriers(),s.carrier,'cur-carrier')}</td>`;if(label==='プラン')return`<td>${select(plans(s.carrier),s.plan,'cur-plan',!s.carrier)}</td>`;if(label==='端末')return`<td><input class="input cur-device" data-line="${i}" value="${esc(s.device)}" placeholder="端末名を入力"></td>`;const k={残債:'balance',支払残数:'remaining',月額:'monthly'}[label];return`<td><input class="input cur-num" data-line="${i}" data-k="${k}" type="number" min="0" value="${s[k]||0}"></td>`}
function fixedInput(label){if(label==='キャリア')return`<td>${select(carriers(),fixedState.carrier,'fix-carrier')}</td>`;if(label==='プラン')return`<td>${select(internet(fixedState.carrier),fixedState.plan,'fix-plan',!fixedState.carrier)}</td>`;if(label==='端末')return`<td><input class="input fix-device" value="${esc(fixedState.device)}" placeholder="固定回線名を入力"></td>`;const k={残債:'balance',支払残数:'remaining',月額:'monthly'}[label];return`<td><input class="input fix-num" data-k="${k}" type="number" min="0" value="${fixedState[k]||0}"></td>`}
function renderCurrent(){document.getElementById('currentHead').innerHTML='<th class="label">項目</th>'+lines.map(x=>`<th>${x}</th>`).join('')+'<th>固定回線</th>';const rows=['キャリア','プラン','端末','残債','支払残数','月額'];document.getElementById('currentBody').innerHTML=rows.map(label=>`<tr><td class="label">${label}</td>${lines.map((_,i)=>currentInput(i,label)).join('')}<td>${fixedInput(label).replace(/^<td>|<\/td>$/g,'')}</td></tr>`).join('');bindCurrent();renderProposal();renderCompare()}
function bindCurrent(){document.querySelectorAll('.cur-carrier').forEach((e,i)=>e.onchange=()=>{currentState[i].carrier=e.value;currentState[i].plan='';renderCurrent()});document.querySelectorAll('.cur-plan').forEach((e,i)=>e.onchange=()=>{currentState[i].plan=e.value;renderCompare()});document.querySelectorAll('.cur-device').forEach(e=>e.oninput=()=>{currentState[+e.dataset.line].device=e.value;renderCompare()});document.querySelectorAll('.cur-num').forEach(e=>e.oninput=()=>{currentState[+e.dataset.line][e.dataset.k]=num(e.value);renderCompare()});const fc=document.querySelector('.fix-carrier');if(fc)fc.onchange=e=>{fixedState.carrier=e.target.value;fixedState.plan='';renderCurrent()};const fp=document.querySelector('.fix-plan');if(fp)fp.onchange=e=>{fixedState.plan=e.value;renderCompare()};const fd=document.querySelector('.fix-device');if(fd)fd.oninput=e=>fixedState.device=e.value;document.querySelectorAll('.fix-num').forEach(e=>e.oninput=()=>{fixedState[e.dataset.k]=num(e.value);renderCompare()})}
function planPrice(s){const r=planRows(s.carrier,s.plan).find(x=>String(x[1])===String(s.data));return r?num(r[2]):0}
function selectedDeviceRow(s){return deviceRows(s.carrier).find(r=>deviceTypeMatch(r,s.deviceType)&&r[1]===s.device&&String(r[2])===String(s.installment)&&r[3]===s.division)}
function deviceMonthly(s){const r=selectedDeviceRow(s);return r?num(r[4]):0}
function optionsTotal(s){return s.options.reduce((a,o)=>a+optionPrice(s.carrier,o),0)}
function calcLine(s){s.monthly=planPrice(s)+deviceMonthly(s)+optionsTotal(s);return s.monthly}
function calcFixed(f){const r=internetRows(f.carrier,f.plan).find(x=>String(x[1])===String(f.type));f.monthly=r?num(r[2])+num(r[3]):0;return f.monthly}
function proposalTotal(p){return p.lines.reduce((a,s)=>a+num(s.monthly),0)+num(p.fixed.monthly)}
function optionUI(s,pi,j){const os=options(s.carrier);if(!os.length)return'<span class="sub">GAS登録なし</span>';return`<div class="options">${os.map(o=>`<label><input type="checkbox" class="p-opt" data-p="${pi}" data-j="${j}" value="${esc(o)}" ${s.options.includes(o)?'checked':''}>${esc(o)}(+¥${optionPrice(s.carrier,o).toLocaleString()})</label>`).join('')}</div>`}
function proposalBlock(p,pi){return`<div class="wrap" style="margin-bottom:14px"><table class="table"><thead><tr><th>提案${circled[pi]||pi+1}</th>${lines.map(x=>`<th>${x}</th>`).join('')}<th>固定回線</th><th>合計</th></tr></thead><tbody>
<tr><td class="label">キャリア</td>${p.lines.map((s,j)=>`<td>${select(carriers(),s.carrier,'p-carrier').replace('<select','<select data-p="'+pi+'" data-j="'+j+'"')}</td>`).join('')}<td>${select(carriers(),p.fixed.carrier,'p-fix-carrier').replace('<select','<select data-p="'+pi+'"')}</td><td rowspan="9" class="money">¥${proposalTotal(p).toLocaleString()}</td></tr>
<tr><td class="label">プラン</td>${p.lines.map((s,j)=>`<td>${select(plans(s.carrier),s.plan,'p-plan',!s.carrier).replace('<select','<select data-p="'+pi+'" data-j="'+j+'"')}</td>`).join('')}<td>${select(internet(p.fixed.carrier),p.fixed.plan,'p-fix-plan',!p.fixed.carrier).replace('<select','<select data-p="'+pi+'"')}</td></tr>
<tr><td class="label">データ量</td>${p.lines.map((s,j)=>`<td>${select(uniq(planRows(s.carrier,s.plan).map(r=>r[1])),s.data,'p-data',!s.plan).replace('<select','<select data-p="'+pi+'" data-j="'+j+'"')}</td>`).join('')}<td class="sub">—</td></tr>
<tr><td class="label">区分</td>${p.lines.map((s,j)=>`<td>${select(divisions(s.carrier,s.deviceType),s.division,'p-division',!s.carrier,Object.fromEntries(divisions(s.carrier,s.deviceType).map(v=>[v,DIVISION_LABELS[v]||v]))).replace('<select','<select data-p="'+pi+'" data-j="'+j+'"')}</td>`).join('')}<td class="sub">—</td></tr>
<tr><td class="label">端末種別</td>${p.lines.map((s,j)=>`<td>${select(DEVICE_TYPES,s.deviceType,'p-device-type',!s.division).replace('<select','<select data-p="'+pi+'" data-j="'+j+'"')}</td>`).join('')}<td class="sub">—</td></tr>
<tr><td class="label">端末</td>${p.lines.map((s,j)=>`<td>${select(devices(s.carrier,s.deviceType,s.division),s.device,'p-device',!s.deviceType).replace('<select','<select data-p="'+pi+'" data-j="'+j+'"')}</td>`).join('')}<td><input class="input" disabled placeholder="固定回線"></td></tr>
<tr><td class="label">分割</td>${p.lines.map((s,j)=>`<td>${select(installments(s.carrier,s.deviceType,s.device),s.installment,'p-installment',!s.device).replace('<select','<select data-p="'+pi+'" data-j="'+j+'"')}</td>`).join('')}<td class="sub">—</td></tr>
<tr><td class="label">オプション</td>${p.lines.map((s,j)=>`<td>${optionUI(s,pi,j)}</td>`).join('')}<td class="sub">—</td></tr>
<tr><td class="label">月額</td>${p.lines.map((s,j)=>`<td class="money">¥${num(s.monthly).toLocaleString()}</td>`).join('')}<td class="money">¥${num(p.fixed.monthly).toLocaleString()}</td></tr>
</tbody></table></div>`}
function renderProposal(){document.getElementById('proposalArea').innerHTML=proposals.map(proposalBlock).join('');bindProposal()}
function bindProposal(){
document.querySelectorAll('.p-carrier').forEach(e=>e.onchange=()=>{const s=proposals[+e.dataset.p].lines[+e.dataset.j];s.carrier=e.value;s.plan=s.data=s.division=s.deviceType=s.device=s.installment='';s.options=[];s.monthly=0;renderProposal();renderCompare()});
document.querySelectorAll('.p-plan').forEach(e=>e.onchange=()=>{const s=proposals[+e.dataset.p].lines[+e.dataset.j];s.plan=e.value;s.data='';calcLine(s);renderProposal();renderCompare()});
document.querySelectorAll('.p-data').forEach(e=>e.onchange=()=>{const s=proposals[+e.dataset.p].lines[+e.dataset.j];s.data=e.value;calcLine(s);renderProposal();renderCompare()});
document.querySelectorAll('.p-division').forEach(e=>e.onchange=()=>{const s=proposals[+e.dataset.p].lines[+e.dataset.j];s.division=e.value;s.deviceType=s.device=s.installment='';calcLine(s);renderProposal();renderCompare()});
document.querySelectorAll('.p-device-type').forEach(e=>e.onchange=()=>{const s=proposals[+e.dataset.p].lines[+e.dataset.j];s.deviceType=e.value;s.device=s.installment='';calcLine(s);renderProposal();renderCompare()});
document.querySelectorAll('.p-device').forEach(e=>e.onchange=()=>{const s=proposals[+e.dataset.p].lines[+e.dataset.j];s.device=e.value;s.installment='';calcLine(s);renderProposal();renderCompare()});
document.querySelectorAll('.p-installment').forEach(e=>e.onchange=()=>{const s=proposals[+e.dataset.p].lines[+e.dataset.j];s.installment=e.value;calcLine(s);renderProposal();renderCompare()});
document.querySelectorAll('.p-opt').forEach(e=>e.onchange=()=>{const s=proposals[+e.dataset.p].lines[+e.dataset.j];if(e.checked){const g=(EXCLUSIVE_GROUPS[s.carrier]||[]).find(a=>a.includes(e.value));if(g)s.options=s.options.filter(x=>!g.includes(x));s.options.push(e.value)}else s.options=s.options.filter(x=>x!==e.value);calcLine(s);renderProposal();renderCompare()});
document.querySelectorAll('.p-fix-carrier').forEach(e=>e.onchange=()=>{const f=proposals[+e.dataset.p].fixed;f.carrier=e.value;f.plan=f.type='';f.monthly=0;renderProposal();renderCompare()});
document.querySelectorAll('.p-fix-plan').forEach(e=>e.onchange=()=>{const f=proposals[+e.dataset.p].fixed;f.plan=e.value;f.type='';calcFixed(f);renderProposal();renderCompare()})}
function currentTerminalRemaining(){return currentState.reduce((a,s)=>a+num(s.balance)*num(s.remaining),0)}
function currentTotal(){return currentState.reduce((a,s)=>a+num(s.monthly),0)+num(fixedState.monthly)}
function renderCompare(){const cur=currentTotal();const terminalRemaining=currentTerminalRemaining();document.getElementById('compareHead').innerHTML='<th>項目</th><th>現在</th>'+proposals.map((_,i)=>`<th>提案${circled[i]||i+1}</th>`).join('');let body=lines.map((x,i)=>`<tr><td class="label">${x}</td><td>¥${num(currentState[i]?.monthly).toLocaleString()}</td>${proposals.map(p=>`<td>¥${num(p.lines[i]?.monthly).toLocaleString()}</td>`).join('')}</tr>`).join('');body+=`<tr><td class="label">固定回線</td><td>¥${num(fixedState.monthly).toLocaleString()}</td>${proposals.map(p=>`<td>¥${num(p.fixed.monthly).toLocaleString()}</td>`).join('')}</tr>`;const totals=proposals.map(proposalTotal);body+=`<tr><td class="label">合計</td><td class="money">¥${cur.toLocaleString()}</td>${totals.map(v=>`<td class="money">¥${v.toLocaleString()}</td>`).join('')}</tr>`;body+=`<tr><td class="label">総額／増減</td><td class="delta">—</td>${totals.map(v=>{const monthlyDelta=cur-v;const annualDelta=monthlyDelta*12+terminalRemaining;return`<td class="delta">${monthlyDelta>=0?'▲':'▼'}¥${Math.abs(monthlyDelta).toLocaleString()}/月<br>${annualDelta>=0?'▲':'▼'}¥${Math.abs(annualDelta).toLocaleString()}/年</td>`}).join('')}</tr>`;document.getElementById('compareBody').innerHTML=body}
function syncNewLine(){lines.push(String.fromCharCode(65+lines.length));currentState.push(newCurrent());proposals.forEach(p=>p.lines.push(newLine()));renderCurrent()}
document.getElementById('addLine').onclick=syncNewLine;
document.getElementById('addProposal').onclick=()=>{proposals.push(makeProposal());renderProposal();renderCompare()};
document.getElementById('copyProposal').onclick=()=>{proposals.push(JSON.parse(JSON.stringify(proposals[proposals.length-1])));renderProposal();renderCompare()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});
async function loadGAS(){try{const r=await fetch(GAS_URL,{redirect:'follow'});if(!r.ok)throw new Error('HTTP '+r.status);GLOBAL_DATA=await r.json();document.getElementById('status').textContent=`GASデータ取得完了（${carriers().length}キャリア）`;renderCurrent()}catch(e){document.getElementById('status').textContent='GASデータ取得エラー';document.getElementById('status').classList.add('error');console.error(e);renderCurrent()}}
renderCurrent();loadGAS();
</script>
</body>
</html>
