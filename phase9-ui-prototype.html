<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>料金シミュレーター Phase 9</title><style>:root{--green:#087f5b;--green-bg:#eaf7f2;--border:#d9dee5;--bg:#f4f6f8;--muted:#69717d;--danger:#d64545}*{box-sizing:border-box}body{margin:0;font-family:Meiryo,sans-serif;background:var(--bg);color:#20242a}.header{height:58px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;font-size:20px;font-weight:700}.tabs{height:48px;background:#fff;border-bottom:1px solid var(--border);display:flex;padding-left:24px}.tab{height:48px;padding:0 30px;border:0;background:#fff;color:var(--muted);font-weight:700;cursor:pointer;border-bottom:3px solid transparent}.tab.active{color:var(--green);background:var(--green-bg);border-bottom-color:var(--green)}.main{padding:16px 20px}.panel{display:none}.panel.active{display:block}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.head h2{margin:0;font-size:17px}.tools{display:flex;gap:8px}.btn{border:1px solid var(--border);background:#fff;border-radius:6px;padding:8px 14px;font-weight:700;cursor:pointer}.primary{background:var(--green);color:#fff;border-color:var(--green)}.wrap{overflow:auto;background:#fff;border:1px solid var(--border);border-radius:8px}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{border:1px solid var(--border);padding:8px;text-align:center;vertical-align:middle}.table th{background:#f8fafb;font-size:12px}.label{text-align:left!important;font-weight:700;background:#f8fafb;white-space:nowrap}.sub{font-size:11px;color:var(--muted)}.input,.select{width:100%;padding:7px;border:1px solid var(--border);border-radius:6px;background:#fff}.money{font-weight:700}.delta{font-size:16px;font-weight:800;white-space:nowrap}.status{position:fixed;right:14px;bottom:14px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;z-index:20}.status.error{color:var(--danger)}.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.note{background:#fff;border:1px solid var(--border);border-radius:8px}.note h3{margin:0;padding:10px 12px;background:#f8fafb;border-bottom:1px solid var(--border);font-size:14px}.note textarea{margin:12px;width:calc(100% - 24px);height:120px}.options{display:flex;flex-wrap:wrap;gap:6px;text-align:left}.options label{display:inline-flex;align-items:center;gap:3px;font-size:12px}@media(max-width:700px){.tab{flex:1;padding:0 8px}.tabs{padding-left:0}.main{padding:12px}.compare-grid{grid-template-columns:1fr}.header{padding:0 14px}}</style></head><body><header class="header">料金シミュレーター <small style="margin-left:12px;font-size:12px;color:#69717d">Phase 9</small></header><nav class="tabs"><button class="tab active" data-tab="current">現在</button><button class="tab" data-tab="proposal">提案</button><button class="tab" data-tab="compare">比較</button></nav><main class="main"><section id="current" class="panel active"><div class="head"><div><h2>現在の契約状況</h2><div class="sub">契約回線をA・B・C…として管理。家族構成は仮定しません。</div></div><button class="btn primary" id="addLine">＋ 回線を増やす</button></div><div class="wrap"><table class="table"><thead><tr id="currentHead"></tr></thead><tbody id="currentBody"></tbody></table></div></section><section id="proposal" class="panel"><div class="head"><div><h2>提案</h2><div class="sub">提案①から開始。回線数は現在タブと連動します。</div></div><div class="tools"><button class="btn primary" id="addProposal">＋ 提案を追加</button><button class="btn" id="copyProposal">提案をコピー</button></div></div><div id="proposalArea"></div></section><section id="compare" class="panel"><div class="head"><h2>比較</h2></div><div class="wrap"><table class="table"><thead><tr id="compareHead"></tr></thead><tbody id="compareBody"></tbody></table></div><div class="compare-grid"><div class="note"><h3>乗り換え後のメリット</h3><ul><li>月額料金の差額を表示</li><li>年間削減額を表示</li><li>適用される主な割引・セットを表示</li></ul></div><div class="note"><h3>MEMO</h3><textarea placeholder="商談メモを入力"></textarea></div></div></section></main><div id="status" class="status">GASデータ読込中…</div><script>
const GAS_URL='https://script.google.com/macros/s/AKfycbxUj8Ojmgq2H-weGZRui_rdi9W6_y6QSUjbjKY1Lr89IsErmVNqxYZx_walEIs3QoaA/exec';
const EXCLUSIVE_GROUPS={'UQ':[['自宅セット','家族セット']],'Y!mobile':[['家族割引','おうち割 光セット','おうち割 でんきセット'],['PayPayカード割 ゴールド','PayPayカード割']],'softbank':[]};
let GLOBAL_DATA=null,lines=['A'];
const currentState=[{carrier:'',plan:'',device:'',balance:0,remaining:0,monthly:0}];
const fixedState={carrier:'',plan:'',device:'',balance:0,remaining:0,monthly:0};
const circled=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
let proposals=[makeProposal()];
function makeLine(){return{carrier:'',plan:'',device:'',options:[],monthly:0}}
function makeProposal(){return{lines:lines.map(()=>makeLine()),fixed:{carrier:'',plan:'',device:'',monthly:0}}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uniq(a){return[...new Set((a||[]).filter(Boolean))]}
function carriers(){return GLOBAL_DATA?Object.keys(GLOBAL_DATA):[]}
function plans(c){return uniq((GLOBAL_DATA?.[c]?.plans||[]).map(r=>r[0]))}
function internet(c){return uniq((GLOBAL_DATA?.[c]?.internets||[]).map(r=>r[0]))}
function options(c){return uniq((GLOBAL_DATA?.[c]?.options||[]).map(r=>r[0]))}
function select(list,value,cls='',disabled=false){return `<select class="select ${cls}" ${disabled?'disabled':''}><option value="">選択してください</option>${list.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select>`}
function renderCurrent(){document.getElementById('currentHead').innerHTML='<th class="label">項目</th>'+lines.map(x=>`<th>${x}</th>`).join('')+'<th>固定回線</th>';const rows=['キャリア','プラン','端末','残債','支払残数','月額'];document.getElementById('currentBody').innerHTML=rows.map(label=>`<tr><td class="label">${label}</td>${lines.map((_,i)=>currentInput(i,label)).join('')}<td>${fixedInput(label)}</td></tr>`).join('');bindCurrent();renderProposal();renderCompare()}
function currentInput(i,label){const s=currentState[i];if(label==='キャリア')return`<td>${select(carriers(),s.carrier,'cur-carrier')}</td>`;if(label==='プラン')return`<td>${select(plans(s.carrier),s.plan,'cur-plan',!s.carrier)}</td>`;if(label==='端末')return`<td><input class="input cur-device" value="${esc(s.device)}" placeholder="端末名を入力"></td>`;const k={残債:'balance',支払残数:'remaining',月額:'monthly'}[label];return`<td><input class="input cur-num" data-k="${k}" type="number" min="0" value="${s[k]||0}"></td>`}
function fixedInput(label){if(label==='キャリア')return select(carriers(),fixedState.carrier,'fix-carrier');if(label==='プラン')return select(internet(fixedState.carrier),fixedState.plan,'fix-plan',!fixedState.carrier);if(label==='端末')return`<input class="input fix-device" value="${esc(fixedState.device)}" placeholder="固定回線名を入力">`;const k={残債:'balance',支払残数:'remaining',月額:'monthly'}[label];return`<input class="input fix-num" data-k="${k}" type="number" min="0" value="${fixedState[k]||0}">`}
function bindCurrent(){document.querySelectorAll('.cur-carrier').forEach((e,i)=>e.onchange=()=>{currentState[i].carrier=e.value;currentState[i].plan='';renderCurrent()});document.querySelectorAll('.cur-plan').forEach((e,i)=>e.onchange=()=>currentState[i].plan=e.value);document.querySelectorAll('.cur-device').forEach((e,i)=>e.oninput=()=>currentState[i].device=e.value);document.querySelectorAll('.cur-num').forEach((e,i)=>e.oninput=()=>currentState[i][e.dataset.k]=+e.value||0);document.querySelector('.fix-carrier').onchange=e=>{fixedState.carrier=e.target.value;fixedState.plan='';renderCurrent()};document.querySelector('.fix-plan').onchange=e=>fixedState.plan=e.target.value;document.querySelector('.fix-device').oninput=e=>fixedState.device=e.target.value;document.querySelectorAll('.fix-num').forEach(e=>e.oninput=()=>fixedState[e.dataset.k]=+e.value||0)}
function renderProposal(){const a=document.getElementById('proposalArea');a.innerHTML=proposals.map((p,pi)=>`<div class="wrap" style="margin-bottom:14px"><table class="table"><thead><tr><th>提案${circled[pi]||pi+1}</th>${lines.map(x=>`<th>${x}</th>`).join('')}<th>固定回線</th><th>合計</th></tr></thead><tbody><tr><td class="label">キャリア</td>${p.lines.map((s,j)=>`<td>${select(carriers(),s.carrier,'p-carrier',false).replace('<select','<select data-p="'+pi+'" data-j="'+j+'"')}</td>`).join('')}<td>${select(carriers(),p.fixed.carrier,'p-fix-carrier').replace('<select','<select data-p="'+pi+'"')}</td><td rowspan="5" class="money">¥${proposalTotal(p).toLocaleString()}</td></tr><tr><td class="label">プラン</td>${p.lines.map((s,j)=>`<td>${select(plans(s.carrier),s.plan,'p-plan',!s.carrier).replace('<select','<select data-p="'+pi+'" data-j="'+j+'"')}</td>`).join('')}<td>${select(internet(p.fixed.carrier),p.fixed.plan,'p-fix-plan',!p.fixed.carrier).replace('<select','<select data-p="'+pi+'"')}</td></tr><tr><td class="label">端末</td>${p.lines.map((s,j)=>`<td><input class="input p-device" data-p="${pi}" data-j="${j}" value="${esc(s.device)}" placeholder="端末名を入力"></td>`).join('')}<td><input class="input p-fix-device" data-p="${pi}" value="${esc(p.fixed.device)}" placeholder="固定回線名を入力"></td></tr><tr><td class="label">オプション</td>${p.lines.map((s,j)=>`<td><div class="options">${options(s.carrier).length?options(s.carrier).map(o=>`<label><input type="checkbox" class="p-opt" data-p="${pi}" data-j="${j}" value="${esc(o)}" ${s.options.includes(o)?'checked':''}>${esc(o)}</label>`).join(''):'<span class="sub">GAS登録なし</span>'}</div></td>`).join('')}<td>—</td></tr><tr><td class="label">月額</td>${p.lines.map((s,j)=>`<td><input class="input p-monthly" data-p="${pi}" data-j="${j}" type="number" min="0" value="${s.monthly||0}"></td>`).join('')}<td><input class="input p-fix-monthly" data-p="${pi}" type="number" min="0" value="${p.fixed.monthly||0}"></td></tr></tbody></table></div>`).join('');bindProposal()}
function proposalTotal(p){return p.lines.reduce((s,x)=>s+(+x.monthly||0),0)+(+p.fixed.monthly||0)}
function bindProposal(){document.querySelectorAll('.p-carrier').forEach(e=>e.onchange=()=>{const p=+e.dataset.p,j=+e.dataset.j;proposals[p].lines[j].carrier=e.value;proposals[p].lines[j].plan='';proposals[p].lines[j].options=[];renderProposal()});document.querySelectorAll('.p-plan').forEach(e=>e.onchange=()=>proposals[+e.dataset.p].lines[+e.dataset.j].plan=e.value);document.querySelectorAll('.p-device').forEach(e=>e.oninput=()=>proposals[+e.dataset.p].lines[+e.dataset.j].device=e.value);document.querySelectorAll('.p-opt').forEach(e=>e.onchange=()=>{const s=proposals[+e.dataset.p].lines[+e.dataset.j];if(e.checked){const groups=EXCLUSIVE_GROUPS[s.carrier]||[];const group=groups.find(g=>g.includes(e.value));if(group)s.options=s.options.filter(x=>!group.includes(x));s.options.push(e.value)}else s.options=s.options.filter(x=>x!==e.value);renderProposal()});document.querySelectorAll('.p-monthly').forEach(e=>e.oninput=()=>{proposals[+e.dataset.p].lines[+e.dataset.j].monthly=+e.value||0;renderCompare()});document.querySelectorAll('.p-fix-carrier').forEach(e=>e.onchange=()=>{const p=+e.dataset.p;proposals[p].fixed.carrier=e.value;proposals[p].fixed.plan='';renderProposal()});document.querySelectorAll('.p-fix-plan').forEach(e=>e.onchange=()=>proposals[+e.dataset.p].fixed.plan=e.value);document.querySelectorAll('.p-fix-device').forEach(e=>e.oninput=()=>proposals[+e.dataset.p].fixed.device=e.value);document.querySelectorAll('.p-fix-monthly').forEach(e=>e.oninput=()=>{proposals[+e.dataset.p].fixed.monthly=+e.value||0;renderCompare()})}
function renderCompare(){const cur=currentState.reduce((s,x)=>s+(+x.monthly||0),0)+(+fixedState.monthly||0);document.getElementById('compareHead').innerHTML='<th>項目</th><th>現在</th>'+proposals.map((_,i)=>`<th>提案${circled[i]||i+1}</th>`).join('');let body=lines.map((x,i)=>`<tr><td class="label">${x}</td><td>¥${(+currentState[i].monthly||0).toLocaleString()}</td>${proposals.map(p=>`<td>¥${(+p.lines[i].monthly||0).toLocaleString()}</td>`).join('')}</tr>`).join('');body+=`<tr><td class="label">固定回線</td><td>¥${(+fixedState.monthly||0).toLocaleString()}</td>${proposals.map(p=>`<td>¥${(+p.fixed.monthly||0).toLocaleString()}</td>`).join('')}</tr>`;body+=`<tr><td class="label">合計</td><td class="money">¥${cur.toLocaleString()}</td>${proposals.map(proposalTotal).map(v=>`<td class="money">¥${v.toLocaleString()}</td>`).join('')}</tr>`;body+=`<tr><td class="label">総額／増減</td><td class="delta">—</td>${proposals.map(p=>{const d=cur-proposalTotal(p);return`<td class="delta">${d>=0?'▲':'▼'}¥${Math.abs(d).toLocaleString()}/月<br>${d>=0?'▲':'▼'}¥${Math.abs(d*12).toLocaleString()}/年</td>`}).join('')}</tr>`;document.getElementById('compareBody').innerHTML=body}
document.getElementById('addLine').onclick=()=>{const n=String.fromCharCode(65+lines.length);lines.push(n);currentState.push({carrier:'',plan:'',device:'',balance:0,remaining:0,monthly:0});proposals.forEach(p=>p.lines.push(makeLine()));renderCurrent()};document.getElementById('addProposal').onclick=()=>{proposals.push(makeProposal());renderProposal();renderCompare()};document.getElementById('copyProposal').onclick=()=>{proposals.push(JSON.parse(JSON.stringify(proposals[proposals.length-1])));renderProposal();renderCompare()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});
async function loadGAS(){try{const r=await fetch(GAS_URL,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();if(!d||typeof d!=='object'||!Object.keys(d).length)throw new Error('GLOBAL_DATA empty');GLOBAL_DATA=d;document.getElementById('status').textContent=`GASデータ読込完了（${Object.keys(d).length}キャリア）`;renderCurrent()}catch(e){console.error(e);document.getElementById('status').textContent='GASデータ取得エラー';document.getElementById('status').classList.add('error')}}renderCurrent();loadGAS();</script></body></html>
