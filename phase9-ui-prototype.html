<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>料金シミュレーター Phase 9</title>
<style>
:root{--g:#087f5b;--gb:#eaf7f2;--b:#d9dee5;--bg:#f4f6f8;--m:#69717d;--r:#d64545}*{box-sizing:border-box}body{margin:0;font-family:Meiryo,sans-serif;background:var(--bg);color:#20242a}.header{height:58px;background:#fff;border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 24px;font-size:20px;font-weight:700}.tabs{height:48px;background:#fff;border-bottom:1px solid var(--b);display:flex;padding-left:24px}.tab{height:48px;padding:0 30px;border:0;background:#fff;color:var(--m);font-weight:700;cursor:pointer;border-bottom:3px solid transparent}.tab.active{color:var(--g);background:var(--gb);border-bottom-color:var(--g)}.main{padding:16px 20px}.panel{display:none}.panel.active{display:block}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.head h2{margin:0;font-size:17px}.tools{display:flex;gap:8px}.btn{border:1px solid var(--b);background:#fff;border-radius:6px;padding:8px 14px;font-weight:700;cursor:pointer}.primary{background:var(--g);color:#fff;border-color:var(--g)}.wrap{overflow:auto;background:#fff;border:1px solid var(--b);border-radius:8px}.table{width:100%;border-collapse:collapse;min-width:1050px;table-layout:fixed}.table th:first-child,.table td:first-child{width:120px}.table th,.table td{border:1px solid var(--b);padding:8px;text-align:center;vertical-align:middle}.table th{background:#f8fafb;font-size:12px}.label{text-align:left!important;font-weight:700;background:#f8fafb;white-space:nowrap}.sub{font-size:11px;color:var(--m)}.input,.select{width:100%;padding:7px;border:1px solid var(--b);border-radius:6px;background:#fff}.money{font-weight:700}.delta{font-size:16px;font-weight:800;white-space:nowrap}.status{position:fixed;right:14px;bottom:14px;background:#fff;border:1px solid var(--b);border-radius:8px;padding:8px 12px;font-size:12px;z-index:20}.status.error{color:var(--r)}.options{display:flex;flex-wrap:wrap;gap:6px;text-align:left}.options label{display:inline-flex;align-items:center;gap:3px;font-size:12px;background:#fff9db;padding:4px 6px;border-radius:5px}.options .warranty{background:#fff0f3;border:1px solid #ffd6df}.discounts{display:grid;grid-template-columns:repeat(2,minmax(150px,1fr));gap:6px;text-align:left}.discounts label{display:flex;align-items:center;gap:6px;font-size:12px;background:#fff0f3;border:1px solid #ffd6df;padding:6px 8px;border-radius:5px;cursor:pointer;line-height:1.35}.discounts label input{width:auto;margin:0;accent-color:var(--g)}.discounts label.is-disabled{opacity:.45;cursor:not-allowed}.discounts label.is-selected{font-weight:700;background:#eaf7f2;border-color:#9ed8c4}.discount-summary{line-height:1.7;text-align:left;font-size:12px}.discount-summary span{display:inline-block;margin:1px 4px 1px 0;padding:2px 6px;border-radius:4px;background:#fff0f3;border:1px solid #ffd6df}.discount-summary .none{background:transparent;border:0;padding:0}.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.note{background:#fff;border:1px solid var(--b);border-radius:8px}.note h3{margin:0;padding:10px 12px;background:#f8fafb;border-bottom:1px solid var(--b);font-size:14px}.note textarea{margin:12px;width:calc(100% - 24px);height:120px;resize:vertical;padding:8px;border:1px solid var(--b);border-radius:6px;font-family:inherit}@media(max-width:700px){.tab{flex:1;padding:0 8px}.tabs{padding-left:0}.main{padding:12px}.compare-grid{grid-template-columns:1fr}.header{padding:0 14px}.discounts{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="header">料金シミュレーター <small style="margin-left:12px;font-size:12px;color:#69717d">Phase 9</small></header>
<nav class="tabs"><button class="tab active" data-tab="current">現在</button><button class="tab" data-tab="proposal">提案</button><button class="tab" data-tab="compare">比較</button></nav>
<main class="main">
<section id="current" class="panel active"><div class="head"><div><h2>現在の契約状況</h2><div class="sub">契約回線をA・B・C…として管理。家族構成は仮定しません。</div></div><button class="btn primary" id="addLine">＋ 回線を増やす</button></div><div class="wrap"><table class="table"><thead><tr id="currentHead"></tr></thead><tbody id="currentBody"></tbody></table></div></section>
<section id="proposal" class="panel"><div class="head"><div><h2>提案</h2><div class="sub">キャリア → プラン → データ量 → 区分 → 端末種別 → 端末 → 分割 → オプション → 適用割引</div></div><div class="tools"><button class="btn primary" id="addProposal">＋ 提案を追加</button><button class="btn" id="copyProposal">提案をコピー</button></div></div><div id="proposalArea"></div></section>
<section id="compare" class="panel"><div class="head"><h2>比較</h2></div><div class="wrap"><table class="table"><thead><tr id="compareHead"></tr></thead><tbody id="compareBody"></tbody></table></div><div class="compare-grid"><div class="note"><h3>乗り換え後のメリット</h3><textarea id="benefitMemo" placeholder="乗り換え後のメリットを自由に入力"></textarea></div><div class="note"><h3>MEMO</h3><textarea placeholder="商談メモを入力"></textarea></div></div></section>
</main><div id="status" class="status">GASデータ読込中…</div>
<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbxUj8Ojmgq2H-weGZRui_rdi9W6_y6QSUjbjKY1Lr89IsErmVNqxYZx_walEIs3QoaA/exec';
const EXCLUSIVE_GROUPS={UQ:[['自宅セット','家族セット']], 'Y!mobile':[['家族割引','おうち割 光セット','おうち割 でんきセット'],['PayPayカード割 ゴールド','PayPayカード割']],softbank:[]};
const FIXED_EXCLUSIVE_GROUPS={UQ:['自宅セット割','家族セット割'],'Y!mobile':['おうち割 光セット(A)','家族割引'],docomo:['ドコモ光セット割','みんなドコモ割'],au:['auスマートバリュー','家族割プラス'],softbank:['おうち割 光セット','新みんな家族割']};
const DEVICE_TYPES=['Android','iPhone','SIMのみ'];const DEVICE_DISCOUNT_CARRIERS=['docomo','au','softbank','SoftBank','UQ','Y!mobile'];
const DIVISION_LABELS={mnp:'MNP',new:'新規',standalone:'端末のみ','機種変更':'端末のみ','端末のみ':'端末のみ',MNP:'MNP',新規:'新規'};
let GLOBAL_DATA=null,lines=['A'];
const circled=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
const currentState=[newCurrent()];
const fixedState=newFixed();
let proposals=[makeProposal()];
function newCurrent(){return{carrier:'',plan:'',device:'',balance:0,remaining:0,monthly:0}}
function newFixed(){return{carrier:'',plan:'',type:'',device:'',balance:0,remaining:0,monthly:0,options:[]}}
function newLine(){return{carrier:'',plan:'',data:'',division:'',deviceType:'',device:'',installment:'',warranty:false,options:[],appliedDiscounts:[],deviceDiscount:0,monthly:0}}
function makeProposal(){return{lines:lines.map(newLine),fixed:newFixed()}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uniq(a){return[...new Set((a||[]).filter(v=>v!==undefined&&v!==null&&v!==''))]}
function num(v){const n=parseInt(String(v??0).replace(/[^0-9-]/g,''),10);return Number.isFinite(n)?n:0}
function money(v){return`¥${num(v).toLocaleString('ja-JP')}`}
function norm(v){return String(v??'').trim().replace(/\s+/g,' ')}
function carriers(){return GLOBAL_DATA?Object.keys(GLOBAL_DATA):[]}
function plans(c){return uniq((GLOBAL_DATA?.[c]?.plans||[]).map(r=>r[0]))}
function planRows(c,p){return(GLOBAL_DATA?.[c]?.plans||[]).filter(r=>r[0]===p)}
function deviceRows(c){return GLOBAL_DATA?.[c]?.devices||[]}
function deviceTypeMatch(r,t){return !t||norm(r[0])===norm(t)}
function divisions(c,t){return uniq(deviceRows(c).filter(r=>deviceTypeMatch(r,t)).map(r=>r[3]))}
function devices(c,t,dv){return uniq(deviceRows(c).filter(r=>deviceTypeMatch(r,t)&&r[3]===dv).map(r=>r[1]))}
function installments(c,t,d){return uniq(deviceRows(c).filter(r=>deviceTypeMatch(r,t)&&r[1]===d).map(r=>r[2]))}
function internet(c){return uniq((GLOBAL_DATA?.[c]?.internets||[]).map(r=>r[0]))}
function internetRows(c,n){return(GLOBAL_DATA?.[c]?.internets||[]).filter(r=>r[0]===n&&r[1]!==undefined&&r[1]!=='')}
function internetOptionRows(c){return(GLOBAL_DATA?.[c]?.internets||[]).filter(r=>r[5]!==undefined&&r[5]!=='')}
function options(c){return uniq((GLOBAL_DATA?.[c]?.options||[]).map(r=>r[0]))}
function optionPrice(c,n){const r=(GLOBAL_DATA?.[c]?.options||[]).find(x=>x[0]===n);return r?num(r[1]):0}
function discountRows(c){return GLOBAL_DATA?.[c]?.discounts||[]}
function discountName(r){return String(r?.[0]??'')}
function discountPrice(r){return num(r?.[2])}
function discountDisplayPrice(c,name){const rows=discountRows(c).filter(r=>discountName(r)===name);if(!rows.length)return 0;const prices=rows.map(r=>discountPrice(r));const nonZero=prices.find(v=>v!==0);return nonZero!==undefined?nonZero:prices[0]}
function selectedDeviceRow(s){return deviceRows(s.carrier).find(r=>deviceTypeMatch(r,s.deviceType)&&r[1]===s.device&&String(r[2])===String(s.installment)&&r[3]===s.division)}
function warrantyPrice(s){const r=selectedDeviceRow(s);return r?num(r[6]):0}function deviceDiscountEligible(c){return DEVICE_DISCOUNT_CARRIERS.includes(c)||norm(c).toLowerCase()==='softbank'}
function select(list,value,cls='',disabled=false,labels={}){return`<select class="select ${cls}" ${disabled?'disabled':''}><option value="">選択してください</option>${list.map(x=>`<option value="${esc(x)}" ${String(x)===String(value)?'selected':''}>${esc(labels[x]??x)}</option>`).join('')}</select>`}
function currentInput(i,label){const s=currentState[i];if(label==='キャリア')return`<td>${select(carriers(),s.carrier,'cur-carrier')}</td>`;if(label==='プラン')return`<td>${select(plans(s.carrier),s.plan,'cur-plan',!s.carrier)}</td>`;if(label==='端末')return`<td><input class="input cur-device" data-line="${i}" value="${esc(s.device)}" placeholder="端末名を入力"></td>`;const k={残債:'balance',支払残数:'remaining',月額:'monthly'}[label];return`<td><input class="input cur-num" data-line="${i}" data-k="${k}" type="number" min="0" value="${s[k]||0}"></td>`}
function fixedInput(label){if(label==='キャリア')return`<td>${select(carriers(),fixedState.carrier,'fix-carrier')}</td>`;if(label==='プラン')return`<td>${select(internet(fixedState.carrier),fixedState.plan,'fix-plan',!fixedState.carrier)}</td>`;if(label==='端末')return`<td><input class="input fix-device" value="${esc(fixedState.device)}" placeholder="固定回線名を入力"></td>`;const k={残債:'balance',支払残数:'remaining',月額:'monthly'}[label];return`<td><input class="input fix-num" data-k="${k}" type="number" min="0" value="${fixedState[k]||0}"></td>`}
function renderCurrent(){document.getElementById('currentHead').innerHTML='<th class="label">項目</th>'+lines.map(x=>`<th>${x}</th>`).join('')+'<th>固定回線</th>';const rows=['キャリア','プラン','端末','残債','支払残数','月額'];document.getElementById('currentBody').innerHTML=rows.map(label=>`<tr><td class="label">${label}</td>${lines.map((_,i)=>currentInput(i,label)).join('')}<td>${fixedInput(label).replace(/^<td>|<\/td>$/g,'')}</td></tr>`).join('');bindCurrent();renderProposal();renderCompare()}
function bindCurrent(){document.querySelectorAll('.cur-carrier').forEach((e,i)=>e.onchange=()=>{currentState[i].carrier=e.value;currentState[i].plan='';renderCurrent()});document.querySelectorAll('.cur-plan').forEach((e,i)=>e.onchange=()=>{currentState[i].plan=e.value;renderCompare()});document.querySelectorAll('.cur-device').forEach(e=>e.oninput=()=>{currentState[+e.dataset.line].device=e.value;renderCompare()});document.querySelectorAll('.cur-num').forEach(e=>e.oninput=()=>{currentState[+e.dataset.line][e.dataset.k]=num(e.value);renderCompare()});const fc=document.querySelector('.fix-carrier');if(fc)fc.onchange=e=>{fixedState.carrier=e.target.value;fixedState.plan='';renderCurrent()};const fp=document.querySelector('.fix-plan');if(fp)fp.onchange=e=>{fixedState.plan=e.target.value;fixedState.type='';fixedState.options=[];renderCurrent()};const fd=document.querySelector('.fix-device');if(fd)fd.oninput=e=>{fixedState.device=e.value;renderCompare()};document.querySelectorAll('.fix-num').forEach(e=>e.oninput=()=>{fixedState[e.dataset.k]=num(e.value);renderCompare()})}
function planPrice(s){const r=planRows(s.carrier,s.plan).find(x=>String(x[1])===String(s.data));return r?num(r[2]):0}
function deviceMonthly(s){const r=selectedDeviceRow(s),base=r?num(r[4]):0;const monthlyDiscount=Math.floor(num(s.deviceDiscount)/24);return Math.max(0,base-monthlyDiscount)}
function discountPriceFor(s,name){return discountDisplayPrice(s.carrier,name)}
function discountsTotal(s){return(s.appliedDiscounts||[]).reduce((a,n)=>a+discountPriceFor(s,n),0)}
function optionsTotal(s){return s.options.reduce((a,o)=>a+optionPrice(s.carrier,o),0)+(s.warranty?warrantyPrice(s):0)}
function calcLine(s){s.monthly=Math.max(0,planPrice(s)+deviceMonthly(s)+optionsTotal(s)+discountsTotal(s));return s.monthly}
function fixedRows(f){return internetRows(f.carrier,f.plan)}
function fixedBaseRow(f){const rows=fixedRows(f);if(!rows.length||f.type==='')return null;const idx=Number(f.type);if(Number.isInteger(idx)&&idx>=0&&idx<rows.length)return rows[idx];return rows.find(r=>norm(r[1])===norm(f.type))||null}
function fixedBasePrice(f){const r=fixedBaseRow(f);return r?num(r[2])+num(r[3]):0}
function fixedOptionPrice(f,name){const r=internetOptionRows(f.carrier).find(x=>norm(x[5])===norm(name));return r?num(r[6]):0}
function calcFixed(f){f.monthly=Math.max(0,fixedBasePrice(f)+f.options.reduce((a,o)=>a+fixedOptionPrice(f,o),0));return f.monthly}
function proposalTotal(p){return p.lines.reduce((a,s)=>a+num(s.monthly),0)+num(p.fixed.monthly)}
function optionUI(s,pi,j){const arr=[];const wp=warrantyPrice(s);if(wp>0)arr.push(`<label class="warranty"><input type="checkbox" class="p-warranty" data-p="${pi}" data-j="${j}" ${s.warranty?'checked':''}>端末補償(+${money(wp)})</label>`);options(s.carrier).forEach(o=>arr.push(`<label><input type="checkbox" class="p-opt" data-p="${pi}" data-j="${j}" value="${esc(o)}" ${s.options.includes(o)?'checked':''}>${esc(o)}(+${money(optionPrice(s.carrier,o))})</label>`));return arr.length?`<div class="options">${arr.join('')}</div>`:'<span class="sub">端末・分割選択後に表示</span>'}
function fixedOptionUI(f,pi){const rows=internetOptionRows(f.carrier),seen=new Set(),arr=[];for(const r of rows){const n=String(r[5]??'');if(!n||seen.has(n))continue;seen.add(n);const p=num(r[6]);arr.push(`<label><input type="checkbox" class="p-fix-opt" data-p="${pi}" value="${esc(n)}" ${f.options.includes(n)?'checked':''}>${esc(n)}(+${money(p)})</label>`)}return arr.length?`<div class="options">${arr.join('')}</div>`:'<span class="sub">固定回線を選択すると表示</span>'}
function discountAllowed(s,name,others){const c=s.carrier,p=s.plan;if(c==='Rakuten'){const a=['最強家族割','最強こども割','最強青春割','最強シニアプログラム'];if(!a.some(x=>name.includes(x)))return false;if(others.some(x=>x.includes('最強シニアプログラム'))&&(name.includes('最強こども割')||name.includes('最強青春割')))return false;if(name.includes('最強シニアプログラム')&&others.some(x=>x.includes('最強こども割')||x.includes('最強青春割')))return false}if(c==='Y!mobile'){if(name.includes('親子割')&&p.includes('シンプル3 S'))return false;if(p.includes('シンプル3 S')&&name.includes('でんきセット'))return false}if(c==='docomo'){if(p.includes('ahamo'))return false;if(p.includes('ドコモポイ活MAX20')&&name.includes('長期利用割'))return false;if(p.includes('ドコモmini')&&!['ドコモ光セット','home 5G','dカード割','ドコモでんき'].some(x=>name.includes(x)))return false}if(c==='au'){if(p.includes('U12バリュー')&&!['U12家族割','カードお支払い割'].some(x=>name.includes(x)))return false;if(name.includes('U12家族割')&&!p.includes('U12バリュー'))return false;if(p.includes('マネ活2')&&(name.includes('カードお支払い割')||name.includes('家族割プラス')))return false;if(p.includes('シニアバリュー')&&name.includes('家族割プラス'))return false}if(others.includes(name))return false;for(const g of (EXCLUSIVE_GROUPS[c]||[])){if(g.some(x=>name.includes(x))&&others.some(o=>g.some(x=>o.includes(x))))return false}return true}
function discountUI(s,pi,j){
            const selected=[...(s.appliedDiscounts||[])].filter(Boolean).slice(0,5);
            const names=uniq(discountRows(s.carrier).map(discountName));
            if(!s.carrier)return'<span class="sub">キャリア選択後に表示</span>';
            if(!names.length)return'<span class="sub">適用可能な割引なし</span>';
            const html=names.map(name=>{
              const checked=selected.includes(name);
              const others=selected.filter(x=>x!==name);
              const allowed=checked||discountAllowed(s,name,others);
              const disabled=!checked&&(!allowed||selected.length>=5);
              const price=discountDisplayPrice(s.carrier,name);
              return`<label class="${checked?'is-selected ':''}${disabled?'is-disabled':''}"><input type="checkbox" class="p-discount" data-p="${pi}" data-j="${j}" value="${esc(name)}" ${checked?'checked':''} ${disabled?'disabled':''}><span>${esc(name)} (${price>0?'+':''}${price.toLocaleString()}円)</span></label>`;
            }).join('');
            return`<div class="discounts">${html}</div>`;
          }
          function proposalBlock(p,pi){return`<div class="wrap" style="margin-bottom:14px"><table class="table"><thead><tr><th>提案${circled[pi]||pi+1}</th>${lines.map(x=>`<th>${x}</th>`).join('')}<th>固定回線</th><th>合計</th></tr></thead><tbody>
<tr><td class="label">キャリア</td>${p.lines.map((s,j)=>`<td>${select(carriers(),s.carrier,'p-carrier').replace('<select','<select data-p="'+pi+'" data-j="'+j+'"')}</td>`).join('')}<td>${select(carriers(),p.fixed.carrier,'p-fix-carrier').replace('<select','<select data-p="'+pi+'"')}</td><td rowspan="12" class="money">${money(proposalTotal(p))}</td></tr>
<tr><td class="label">プラン</td>${p.lines.map((s,j)=>`<td>${select(plans(s.carrier),s.plan,'p-plan',!s.carrier).replace('<select','<select data-p="'+pi+'" data-j="'+j+'"')}</td>`).join('')}<td>${select(internet(p.fixed.carrier),p.fixed.plan,'p-fix-plan',!p.fixed.carrier).replace('<select','<select data-p="'+pi+'"')}</td></tr>
<tr><td class="label">データ量</td>${p.lines.map((s,j)=>`<td>${select(uniq(planRows(s.carrier,s.plan).map(r=>r[1])),s.data,'p-data',!s.plan).replace('<select','<select data-p="'+pi+'" data-j="'+j+'"')}</td>`).join('')}<td class="sub">—</td></tr>
<tr><td class="label">区分</td>${p.lines.map((s,j)=>`<td>${select(divisions(s.carrier,s.deviceType),s.division,'p-division',!s.carrier,Object.fromEntries(divisions(s.carrier,s.deviceType).map(v=>[v,DIVISION_LABELS[v]||v]))).replace('<select','<select data-p="'+pi+'" data-j="'+j+'"')}</td>`).join('')}<td>${fixedTypeSelect(p.fixed,pi)}</td></tr>
<tr><td class="label">端末種別</td>${p.lines.map((s,j)=>`<td>${select(DEVICE_TYPES,s.deviceType,'p-device-type',!s.division).replace('<select','<select data-p="'+pi+'" data-j="'+j+'"')}</td>`).join('')}<td class="sub">—</td></tr>
<tr><td class="label">端末</td>${p.lines.map((s,j)=>`<td>${select(devices(s.carrier,s.deviceType,s.division),s.device,'p-device',!s.deviceType).replace('<select','<select data-p="'+pi+'" data-j="'+j+'"')}</td>`).join('')}<td><input class="input" disabled placeholder="固定回線"></td></tr>
<tr><td class="label">分割</td>${p.lines.map((s,j)=>`<td>${select(installments(s.carrier,s.deviceType,s.device),s.installment,'p-installment',!s.device).replace('<select','<select data-p="'+pi+'" data-j="'+j+'"')}</td>`).join('')}<td class="sub">—</td></tr>
<tr><td class="label">オプション</td>${p.lines.map((s,j)=>`<td>${optionUI(s,pi,j)}</td>`).join('')}<td>${fixedOptionUI(p.fixed,pi)}</td></tr>
<tr><td class="label">適用割引（最大5つ）</td>${p.lines.map((s,j)=>`<td>${discountUI(s,pi,j)}</td>`).join('')}<td class="sub">固定回線割引は上記オプション</td></tr>
<tr><td class="label">端末値引き</td>${p.lines.map((s,j)=>`<td>${deviceDiscountEligible(s.carrier)?`<input type="number" min="0" class="input p-device-discount" data-p="${pi}" data-j="${j}" value="${num(s.deviceDiscount)||''}" placeholder="端末値引き総額を入力">`:'<span class="sub">—</span>'}</td>`).join('')}<td class="sub">—</td></tr>
<tr><td class="label">月額</td>${p.lines.map((s,j)=>`<td class="money p-monthly" data-p="${pi}" data-j="${j}">${money(s.monthly)}</td>`).join('')}<td class="money">${money(p.fixed.monthly)}</td></tr>
</tbody></table></div>`}
function fixedTypeSelect(f,pi){const rows=fixedRows(f);if(!rows.length)return'<select class="select" disabled><option>選択してください</option></select>';return`<select class="select p-fix-type" data-p="${pi}"><option value="">選択してください</option>${rows.map((r,i)=>`<option value="${i}" ${String(i)===String(f.type)?'selected':''}>${esc(r[1])}</option>`).join('')}</select>`}
function renderProposal(){document.getElementById('proposalArea').innerHTML=proposals.map(proposalBlock).join('');bindProposal()}
function bindProposal(){
document.querySelectorAll('.p-carrier').forEach(e=>e.onchange=()=>{const s=proposals[+e.dataset.p].lines[+e.dataset.j];s.carrier=e.value;s.plan=s.data=s.division=s.deviceType=s.device=s.installment='';s.warranty=false;s.options=[];s.appliedDiscounts=[];s.deviceDiscount=0;s.monthly=0;renderProposal();renderCompare()});
document.querySelectorAll('.p-plan').forEach(e=>e.onchange=()=>{const s=proposals[+e.dataset.p].lines[+e.dataset.j];s.plan=e.value;s.data='';s.appliedDiscounts=[];calcLine(s);renderProposal();renderCompare()});
document.querySelectorAll('.p-data').forEach(e=>e.onchange=()=>{const s=proposals[+e.dataset.p].lines[+e.dataset.j];s.data=e.value;calcLine(s);renderProposal();renderCompare()});
document.querySelectorAll('.p-division').forEach(e=>e.onchange=()=>{const s=proposals[+e.dataset.p].lines[+e.dataset.j];s.division=e.value;s.deviceType=s.device=s.installment='';s.warranty=false;s.options=[];s.deviceDiscount=0;calcLine(s);renderProposal();renderCompare()});
document.querySelectorAll('.p-device-type').forEach(e=>e.onchange=()=>{const s=proposals[+e.dataset.p].lines[+e.dataset.j];s.deviceType=e.value;s.device=s.installment='';s.warranty=false;s.options=[];s.deviceDiscount=0;calcLine(s);renderProposal();renderCompare()});
document.querySelectorAll('.p-device').forEach(e=>e.onchange=()=>{const s=proposals[+e.dataset.p].lines[+e.dataset.j];s.device=e.value;s.installment='';s.warranty=false;s.options=[];s.deviceDiscount=0;calcLine(s);renderProposal();renderCompare()});
document.querySelectorAll('.p-installment').forEach(e=>e.onchange=()=>{const s=proposals[+e.dataset.p].lines[+e.dataset.j];s.installment=e.value;s.warranty=false;s.deviceDiscount=0;calcLine(s);renderProposal();renderCompare()});
document.querySelectorAll('.p-warranty').forEach(e=>e.onchange=()=>{const s=proposals[+e.dataset.p].lines[+e.dataset.j];s.warranty=e.checked;calcLine(s);renderProposal();renderCompare()});
document.querySelectorAll('.p-opt').forEach(e=>e.onchange=()=>{const s=proposals[+e.dataset.p].lines[+e.dataset.j];if(e.checked){const g=(EXCLUSIVE_GROUPS[s.carrier]||[]).find(a=>a.includes(e.value));if(g)s.options=s.options.filter(x=>!g.includes(x));s.options.push(e.value)}else s.options=s.options.filter(x=>x!==e.value);calcLine(s);renderProposal();renderCompare()});
document.querySelectorAll('.p-discount').forEach(e=>e.onchange=()=>{const s=proposals[+e.dataset.p].lines[+e.dataset.j],name=e.value;const arr=[...(s.appliedDiscounts||[])].filter(Boolean);if(e.checked){if(!arr.includes(name)&&arr.length<5)arr.push(name)}else{s.appliedDiscounts=arr.filter(x=>x!==name);calcLine(s);renderProposal();renderCompare();return}s.appliedDiscounts=arr.slice(0,5);calcLine(s);renderProposal();renderCompare()});
document.querySelectorAll('.p-device-discount').forEach(e=>e.oninput=()=>{const s=proposals[+e.dataset.p].lines[+e.dataset.j];s.deviceDiscount=Math.max(0,num(e.value));calcLine(s);const cell=document.querySelector(`.p-monthly[data-p="${e.dataset.p}"][data-j="${e.dataset.j}"]`);if(cell)cell.textContent=money(s.monthly);renderCompare()});
document.querySelectorAll('.p-fix-carrier').forEach(e=>e.onchange=()=>{const f=proposals[+e.dataset.p].fixed;f.carrier=e.value;f.plan=f.type='';f.options=[];f.monthly=0;renderProposal();renderCompare()});
document.querySelectorAll('.p-fix-plan').forEach(e=>e.onchange=()=>{const f=proposals[+e.dataset.p].fixed;f.plan=e.value;f.type='';f.options=[];calcFixed(f);renderProposal();renderCompare()});
document.querySelectorAll('.p-fix-type').forEach(e=>e.onchange=()=>{const f=proposals[+e.dataset.p].fixed;f.type=e.value;calcFixed(f);renderProposal();renderCompare()});
document.querySelectorAll('.p-fix-opt').forEach(e=>e.onchange=()=>{const f=proposals[+e.dataset.p].fixed,name=e.value,group=FIXED_EXCLUSIVE_GROUPS[f.carrier]||[];if(e.checked){if(group.includes(name))f.options=f.options.filter(x=>!group.includes(x)||x===name);if(!f.options.includes(name))f.options.push(name)}else f.options=f.options.filter(x=>x!==name);calcFixed(f);renderProposal();renderCompare()});
}
function currentTerminalRemaining(){return currentState.reduce((a,s)=>a+num(s.balance)*num(s.remaining),0)}
function currentTotal(){return currentState.reduce((a,s)=>a+num(s.monthly),0)+num(fixedState.monthly)}
function optionSummaryLine(s){const arr=[];if(s.warranty&&warrantyPrice(s)>0)arr.push(`端末補償 ${money(warrantyPrice(s))}`);s.options.forEach(o=>arr.push(`${o} ${money(optionPrice(s.carrier,o))}`));return arr.join(' / ')}
function discountSummaryLine(s){return(s.appliedDiscounts||[]).map(n=>`${n} ${money(discountPriceFor(s,n))}`).join(' / ')}
function proposalOptionSummary(p){const arr=[];p.lines.forEach((s,i)=>{const v=optionSummaryLine(s);if(v)arr.push(`${lines[i]}：${v}`)});p.fixed.options.forEach(o=>arr.push(`固定：${o} ${money(fixedOptionPrice(p.fixed,o))}`));return arr.join('<br>')||'—'}
function proposalDiscountSummary(p){const arr=[];p.lines.forEach((s,i)=>{const v=discountSummaryLine(s);if(v)arr.push(`${lines[i]}：${v}`)});return arr.length?arr.join('<br>'):'—'}
function renderCompare(){const cur=currentTotal(),terminalRemaining=currentTerminalRemaining();document.getElementById('compareHead').innerHTML='<th>項目</th><th>現在</th>'+proposals.map((_,i)=>`<th>提案${circled[i]||i+1}</th>`).join('');let body=lines.map((x,i)=>`<tr><td class="label">${x}</td><td>${money(currentState[i]?.monthly)}</td>${proposals.map(p=>`<td>${money(p.lines[i]?.monthly)}</td>`).join('')}</tr>`).join('');body+=`<tr><td class="label">固定回線</td><td>${money(fixedState.monthly)}</td>${proposals.map(p=>`<td>${money(p.fixed.monthly)}</td>`).join('')}</tr>`;body+=`<tr><td class="label">オプション</td><td>—</td>${proposals.map(p=>`<td style="text-align:left;font-size:12px">${proposalOptionSummary(p)}</td>`).join('')}</tr>`;body+=`<tr><td class="label">適用割引（最大5つ）</td><td>—</td>${proposals.map(p=>`<td><div class="discount-summary">${proposalDiscountSummary(p)}</div></td>`).join('')}</tr>`;const totals=proposals.map(proposalTotal);body+=`<tr><td class="label">合計</td><td class="money">${money(cur)}</td>${totals.map(v=>`<td class="money">${money(v)}</td>`).join('')}</tr>`;body+=`<tr><td class="label">総額／増減</td><td class="delta">—</td>${totals.map(v=>{const monthlyDelta=cur-v,annualDelta=monthlyDelta*12+terminalRemaining;return`<td class="delta">${monthlyDelta>=0?'▲':'▼'}${money(Math.abs(monthlyDelta))}/月<br>${annualDelta>=0?'▲':'▼'}${money(Math.abs(annualDelta))}/年</td>`}).join('')}</tr>`;document.getElementById('compareBody').innerHTML=body}
function syncNewLine(){lines.push(String.fromCharCode(65+lines.length));currentState.push(newCurrent());proposals.forEach(p=>p.lines.push(newLine()));renderCurrent()}
document.getElementById('addLine').onclick=syncNewLine;
document.getElementById('addProposal').onclick=()=>{proposals.push(makeProposal());renderProposal();renderCompare()};
document.getElementById('copyProposal').onclick=()=>{proposals.push(JSON.parse(JSON.stringify(proposals[proposals.length-1])));renderProposal();renderCompare()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});
async function loadGAS(){try{const r=await fetch(GAS_URL,{redirect:'follow'});if(!r.ok)throw new Error('HTTP '+r.status);GLOBAL_DATA=await r.json();document.getElementById('status').textContent=`GASデータ取得完了（${carriers().length}キャリア）`;renderCurrent()}catch(e){document.getElementById('status').textContent='GASデータ取得エラー';document.getElementById('status').classList.add('error');console.error(e);renderCurrent()}}
renderCurrent();loadGAS();
</script>
</body>
